/* ═══ DAY VIEW ═══════════════════════════════════════════════════════════
 * DayView: a single day, all periods stacked. The richest editor: each PCard
 * has Quick and Detailed modes, plus a Reflections panel and Day Notes.
 * Reads `metaCache` (meta cache) for the day's mid-morning type; writes via onMS.
 * `fp` is an optional period ID to auto-expand (e.g. when navigating from
 * Week View's "Full detail" link).
 * ═══════════════════════════════════════════════════════════════════════
 */
function DayView({date,setDate,onBack,metaCache,onMS,fp,gam,onUpdateCfg,cfg}){
  const eng=useCfg();const today=useToday();const cd=eng.cycleDayFor(date),dateKey=toDateKey(date),isZ=cd===0,sch=eng.isSchoolDay(date);
  const twn=eng.termWkN(getWDs(date));
  const prev=eng.nearestSchoolDay(date,-1),next=eng.nearestSchoolDay(date,1);
  // "Today" target: if today itself is a school day, use it; otherwise walk forward
  // to the next school day. Mirrors Week View's getPlanMon behaviour (Weekend mode
  // surfaces the next teaching day rather than the weekend). Null when there is no
  // upcoming school day within the engine's walk window.
  const todayTarget=eng.isSchoolDay(today)?today:eng.nearestSchoolDay(today,1);
  const hms=useCallback(saved=>{if(dateKey)onMS(dateKey,saved)},[dateKey]);
  const as=useAutoSave(`daymeta:${dateKey}`,emptyMeta(),hms);const{data:meta,updateField,saveStatus,handleFocus,handleBlur,save}=as;
  // forceShow: per-date ad-hoc reveals for B0/B3 so the teacher can add a one-off
  // before/after-school event even when no cycle default exists. Cleared on date change.
  const[forceShow,setForceShow]=useState({});
  useEffect(()=>{setForceShow({})},[dateKey]);
  const forceSet=useMemo(()=>{const s=new Set();if(forceShow.B0)s.add("B0");if(forceShow.B3)s.add("B3");return s},[forceShow]);
  // Notes saved for a slot+date count as "content" for the visibility check below,
  // so teachers who type notes without committing a slot value still see the row
  // on revisit. nr (note-refresh counter) wakes this memo when notes change.
  const hasSlotNote=useCallback(code=>{const n=storageGet(`note:${dateKey}:${code}`);return!!(n&&(n.subject||n.notes||n.status==="nl"))},[dateKey]);
  const slots=buildSlots(cd,meta,{timetable:eng.timetableForDate(date),weeklyEvents:(cfg&&cfg.weeklyEvents)||[]},date,forceSet,hasSlotNote);
  const hasB0=slots.some(s=>s.code==="B0");
  const hasB3=slots.some(s=>s.code==="B3");
  const duties=(cfg&&cfg.duties)||[];
  // setOverride: write a per-date override for one B-slot into daymeta.overrides.
  // If the chosen value matches the cycle default, drop the override key entirely
  // so isOverride goes back to false (no orange dot). updateField only updates the
  // in-memory ref/state; we call save() after so the daymeta lands in localStorage
  // and the gist sync fires.
  const setOverride=(slotCode,value)=>{
    const cyc=((eng.timetableForDate(date)||{})[cd]||{})[slotCode]||null;
    const cur=(meta&&meta.overrides)||{};
    const next={...cur};
    if(valEq(value,cyc))delete next[slotCode];
    else next[slotCode]=value;
    updateField("overrides",next);
    setTimeout(save,0);
  };
  return<div>{gam.showGam&&<><XpStrip gam={gam}/><Badges achs={gam.achs}/></>}
    <div style={{marginBottom:12,marginTop:10}}><div className="hd" style={{fontSize:"var(--fs-display)",fontWeight:600,color:"var(--text)",lineHeight:1.2}}>{fmtF(date)}</div><div className="hd" style={{fontSize:"var(--fs-emph)",marginTop:4,color:isZ?"var(--dz-text)":sch?"var(--accent)":"var(--error)"}}>{isZ?"Day 0 \u2014 no class structure":sch?`Day ${cd} rotation`:eng.inT(date)?"Holiday / Weekend":"School Holiday"}{twn&&<span style={{color:"var(--text-secondary)",fontWeight:400}}> {"\u00B7"} Term {twn.tn}, Week {twn.wk}</span>}</div></div>
    <div className="np" style={{display:"flex",alignItems:"center",gap:7,marginBottom:14,flexWrap:"wrap"}}><Btn onClick={onBack}>{"\u2190"} Back</Btn><Btn onClick={()=>prev&&setDate(prev)} disabled={!prev}>{"\u2039"} Prev</Btn><Btn onClick={()=>next&&setDate(next)} disabled={!next}>Next {"\u203A"}</Btn><Btn onClick={()=>todayTarget&&setDate(todayTarget)} disabled={!todayTarget}>Today</Btn><div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6}}><SvH saveStatus={saveStatus}/><Btn onClick={()=>window.print()}>{"\u{1F5A8}"} Print</Btn></div></div>
    {!sch?<div style={{color:"var(--text-secondary)",padding:30,textAlign:"center",fontSize:"var(--fs-emph)"}}>No classes scheduled.</div>
    :isZ?<div className="card" style={{padding:18,marginBottom:14,borderColor:"var(--dz-border)",background:"var(--dz-bg)"}}><div className="hd" style={{fontSize:"var(--fs-emph)",color:"var(--dz-text)",fontWeight:600,marginBottom:12}}>Day 0 {"\u2014"} No class structure</div>{meta&&<div style={{display:"grid",gap:10}} onFocus={handleFocus} onBlur={handleBlur}><div><label className="fl">Label / Activity <SvH saveStatus={saveStatus}/></label><AInp data={meta} field="day0label" updateField={updateField} handleFocus={handleFocus} handleBlur={handleBlur} ph="e.g. Orientation, EOTC"/></div><div><label className="flb">Notes</label><AInp data={meta} field="dayNotes" updateField={updateField} handleFocus={handleFocus} handleBlur={handleBlur} ph="Notes" multi rows={3}/></div></div>}</div>
    :<>{meta&&<div className="np" style={{display:"flex",alignItems:"center",gap:6,marginBottom:12,flexWrap:"wrap"}}>
      <span style={{fontSize:"var(--fs-caption)",color:"var(--text-secondary)"}}>Bell times</span>
      {[["auto","Auto"],["std","Standard"],["asm","Assembly"]].map(([v,lbl])=>{const cur=(meta.bells==="asm"||meta.bells==="std")?meta.bells:"auto";const active=cur===v;return<button key={v} onClick={()=>{updateField("bells",v);setTimeout(save,0)}} style={{padding:"3px 10px",borderRadius:"var(--radius-sm)",border:active?"none":"1px solid var(--border)",cursor:"pointer",fontSize:"var(--fs-micro)",fontWeight:active?700:400,background:active?"var(--accent)":"var(--surface)",color:active?"var(--on-accent)":"var(--text-secondary)",fontFamily:"inherit"}}>{lbl}</button>})}
      {(()=>{const cfgR={timetable:eng.timetableForDate(date),weeklyEvents:(cfg&&cfg.weeklyEvents)||[]};const overridden=meta.bells==="asm"||meta.bells==="std";const autoAsm=asmBellsForDate(cd,date,cfgR,{...meta,bells:"auto"});const eff=overridden?meta.bells==="asm":autoAsm;return<span style={{fontSize:"var(--fs-nano)",color:overridden?"var(--flag)":"var(--text-muted)"}}>{overridden?`${eff?"Assembly":"Standard"} (manual)`:autoAsm?"Assembly today (FSA)":"Standard"}</span>})()}
    </div>}{meta&&<div className="card" style={{padding:14,marginBottom:14}}><label className="fl">Day Notes / Meetings <SvH saveStatus={saveStatus}/></label><AInp data={meta} field="dayNotes" updateField={updateField} handleFocus={handleFocus} handleBlur={handleBlur} ph="Meetings, reminders, duty" multi rows={2}/></div>}<div className="card" style={{overflow:"hidden",marginBottom:14}}>
  {!hasB0&&<div style={{padding:"6px 12px",borderBottom:"1px solid var(--border)"}}><button onClick={()=>setForceShow(s=>({...s,B0:true}))} style={{background:"none",border:"1px dashed var(--border-strong)",borderRadius:4,padding:"3px 10px",fontSize:"var(--fs-micro)",color:"var(--text-muted)",cursor:"pointer",fontFamily:"inherit"}}>+ Before school</button></div>}
  {slots.map(s=>{
    if(s.type==="period")return<PCard key={`${dateKey}-${s.id}`} period={s} dateKey={dateKey} cDay={cd} date={date} initOpen={fp===s.id}/>;
    const code=s.code;
    const cyc=((eng.timetableForDate(date)||{})[cd]||{})[code]||null;
    const current=s.type==="bslot"?s.value:null;
    return<BSlotRow key={`${dateKey}-${code}`} slot={s} dateKey={dateKey} cycleDay={cd} current={current} cycleDefault={cyc} isOverride={!!s.isOverride} clash={!!s.clash} duties={duties} onSaveToday={v=>setOverride(code,v)} handleFocus={handleFocus} handleBlur={handleBlur} initOpen={!!s.forced}/>;
  })}
  {!hasB3&&<div style={{padding:"6px 12px",borderTop:"1px solid var(--border)"}}><button onClick={()=>setForceShow(s=>({...s,B3:true}))} style={{background:"none",border:"1px dashed var(--border-strong)",borderRadius:4,padding:"3px 10px",fontSize:"var(--fs-micro)",color:"var(--text-muted)",cursor:"pointer",fontFamily:"inherit"}}>+ After school</button></div>}
</div><ReflectionsPanel meta={meta} updateField={updateField} handleFocus={handleFocus} handleBlur={handleBlur} saveStatus={saveStatus} date={date} save={save}/></>}
  </div>;
}

/* ═══ TERM VIEW ══════════════════════════════════════════════════════════
 * TermView: the term-at-a-glance grid. One row per week, one column per

 * a "Wk" button to open Week View. Defaults to the active term.
 * ═══════════════════════════════════════════════════════════════════════
 */
function TermView({onDay,onWk,metaCache,gam,cfg}){
  const eng=useCfg();const today=useToday();const[termIdx,setTermIdx]=useState(()=>{if(!eng||!eng.terms)return 0;const now=new Date();now.setHours(0,0,0,0);let ati=0;for(let i=0;i<eng.terms.length;i++){if(now<=eng.terms[i].end){ati=i;break}else ati=i}return ati});
  const term=eng.terms[termIdx];const weeks=useMemo(()=>term?eng.getTermWeeks(term):[],[term]);
  const ts=useMemo(()=>{if(!term)return new Date();const d=new Date(term.start);d.setHours(0,0,0,0);return d},[term]);
  const te=useMemo(()=>{if(!term)return new Date();const d=new Date(term.end);d.setHours(23,59,59,999);return d},[term]);
  const cov=useMemo(()=>{const c={};weeks.flat().forEach(d=>{const cd=eng.cycleDayFor(d);if(!cd||cd===0)return;const key=toDateKey(d);let p=0,t=0;eng.PIDS.forEach(pid=>{const cls=eng.classAt(d,cd,pid);if(cls==="nc")return;t++;const n=storageGet(`note:${key}:${pid}`);if(n&&(n.subject||n.notes||n.status==="nl"))p++});c[key]={p,t}});return c},[weeks]);
  if(!term)return<div style={{padding:30,textAlign:"center",color:"var(--text-muted)"}}>No terms configured. Head to Setup to get started.</div>;

    <div style={{marginBottom:14,marginTop:10}}><div style={{display:"flex",gap:6,alignItems:"center",marginBottom:4}}>{eng.terms.map((t,i)=><button key={i} className="hd" onClick={()=>setTermIdx(i)} style={{padding:"4px 12px",borderRadius:"var(--radius-sm)",border:"none",cursor:"pointer",fontSize:"var(--fs-body)",fontWeight:termIdx===i?700:400,background:termIdx===i?"var(--accent)":"var(--surface)",color:termIdx===i?"var(--on-accent)":"var(--text-secondary)"}}>Term {t.n}</button>)}</div><div style={{fontSize:"var(--fs-caption)",color:"var(--text-muted)"}}>{term.start.toLocaleDateString("en-NZ",{day:"numeric",month:"short"})} {"\u2013"} {term.end.toLocaleDateString("en-NZ",{day:"numeric",month:"short",year:"numeric"})}</div></div>
    <div style={{display:"grid",gridTemplateColumns:"58px repeat(5,1fr)",gap:3,marginBottom:4}}><div/>{["Mon","Tue","Wed","Thu","Fri"].map(d=><div key={d} className="hd" style={{fontSize:"var(--fs-micro)",color:"var(--text-muted)",textAlign:"center",fontWeight:600}}>{d}</div>)}</div>
    {weeks.map((days,wi)=><div key={wi} style={{display:"grid",gridTemplateColumns:"58px repeat(5,1fr)",gap:3,marginBottom:3,alignItems:"start"}}><div style={{paddingTop:2}}><Btn onClick={()=>onWk(days[0])} style={{padding:"3px 0",fontSize:"var(--fs-nano)",width:"100%",textAlign:"center",borderRadius:5}}>Wk {wi+1}</Btn></div>
      {days.map(d=>{const dn=new Date(d);dn.setHours(0,0,0,0);const iT=dn>=ts&&dn<=te,sch=eng.isSchoolDay(d),isT=dn.toDateString()===today.toDateString(),cd=sch?eng.cycleDayFor(d):null,isZ=cd===0,k=toDateKey(d),meta=metaCache[k]||emptyMeta(),cv=cov[k];
        if(!iT||!sch)return<div key={k} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius-sm)",minHeight:50,display:"flex",alignItems:"center",justifyContent:"center",padding:"2px 4px"}}>{iT&&(()=>{const hol=(cfg.holidays||[]).find(h=>(typeof h==="string"?h:h.date)===fmtISO(d));return<span style={{fontSize:"var(--fs-nano)",color:"var(--text-muted)",textAlign:"center",lineHeight:1.3}}>{hol&&typeof hol!=="string"?hol.name:"holiday"}</span>})()}</div>;
        return<div key={k} onClick={()=>onDay(d)} style={{background:isT?"var(--today-bg)":isZ?"var(--dz-bg)":"var(--card)",border:`1px solid ${isT?"var(--today-border)":isZ?"var(--dz-border)":"var(--border)"}`,borderRadius:"var(--radius-sm)",padding:"4px 5px",cursor:"pointer",minHeight:50}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:2}}><span className="hd" style={{fontSize:"var(--fs-body)",fontWeight:700,color:isZ?"var(--dz-text)":isT?"var(--accent)":"var(--text)"}}>{d.getDate()}<span style={{fontSize:"var(--fs-nano)",fontWeight:400,color:"var(--text-muted)",marginLeft:2}}>{d.toLocaleDateString("en-NZ",{month:"short"})}</span></span><span className="mn" style={{fontSize:"var(--fs-nano)",fontWeight:600,color:isZ?"var(--dz-text)":"var(--accent)"}}>{isZ?"D0":`D${cd}`}</span></div>
          {isZ?<div style={{fontSize:"var(--fs-nano)",color:"var(--dz-text)",fontStyle:"italic",lineHeight:1.3,overflow:"hidden",maxHeight:26}}>{meta.day0label||(()=>{const dz=(cfg.dayZeros||[]).find(z=>(typeof z==="string"?z:z.date)===fmtISO(d));return dz&&typeof dz!=="string"?dz.label:"Day 0"})()}</div>
          :<>{eng.PIDS&&<div style={{display:"flex",flexDirection:"column",gap:2,marginBottom:2}}>{[["P1"],["P2","P3","P4","P5"],["P6"]].map((row,ri)=><div key={ri} style={{display:"flex",gap:2}}>{row.map(pid=>{const cls=eng.classAt(d,cd,pid);const clr=cls!=="nc"&&eng.classMap[cls];return<div key={pid} title={clr?`${pid} ${cls}`:`${pid} free`} style={clr?{width:8,height:8,borderRadius:2,background:clr.bg}:{width:8,height:8,borderRadius:2,background:"transparent",border:"1px solid var(--text-secondary)",boxSizing:"border-box"}}/>})}</div>)}</div>}<div style={{display:"flex",justifyContent:"flex-end",alignItems:"center"}}>{cv&&cv.t>0&&<span className="mn" style={{fontSize:"var(--fs-nano)",color:cv.p===cv.t?"var(--success)":"var(--text-muted)",fontWeight:700}}>{cv.p}/{cv.t}</span>}</div></>}
        </div>})}</div>)}
    <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:14,alignItems:"center"}}>{eng.classCodes.map(c=>{const cl=eng.classMap[c];return<span key={c} className="mn" style={{background:cl&&cl.bg,color:cl&&cl.tx,padding:"2px 7px",borderRadius:3,fontSize:"var(--fs-nano)",fontWeight:700}}>{c}</span>})}<span style={{fontSize:"var(--fs-nano)",color:"var(--text-muted)",marginLeft:4}}>filled=class, outline=free (P1 top {"\u2192"} P6 bottom) {"\u00B7"} fraction=planned/teaching</span></div></div>;

/* ═══ EXPORT HELPERS ════════════════════════════════════════════════════
 * buildWkTxt / buildReflTxt: turn a week's data into a text document. The
 * `style` parameter switches heading and bullet syntax: "org" for org-mode,
 * "plain" for unstyled text. (Markdown was removed in v1.1.1 because macOS
 * was flagging .md downloads as suspicious.)
 *
 * doDownload: trigger a browser download of the given text content.
 * ═══════════════════════════════════════════════════════════════════════
 */
function buildWkTxt(style,days,wl,wkLabel,sum,metaCache,eng,wNotes,cfg){
  const h1=s=>style==="org"?`* ${s}\n`:style==="plain"?`${s}\n${"=".repeat(Math.min(s.length,44))}\n`:`# ${s}\n`;
  const h2=s=>style==="org"?`** ${s}\n`:style==="plain"?`${s}\n${"-".repeat(Math.min(s.length,44))}\n`:`## ${s}\n`;
  const h3=s=>style==="org"?`*** ${s}\n`:style==="plain"?`  ${s}:\n`:`### ${s}\n`;
  const bq=s=>style==="md"?`> ${s}\n`:`  ${s}\n`;
  // Render one B-slot line; suppress entirely if value is null AND no notes.
  const bSlotLine=(code,d,cd,key,meta)=>{
    const tt=eng.timetableForDate(d);
    const asm=asmBellsForDate(cd,d,{timetable:tt,weeklyEvents:(cfg&&cfg.weeklyEvents)||[]},meta);
    const r=resolveSlot(code,cd,d,{timetable:tt,weeklyEvents:(cfg&&cfg.weeklyEvents)||[]},meta);
    const note=storageGet(`note:${key}:${code}`);
    const hasNote=!!(note&&(note.subject||note.notes||note.status==="nl"));
    if(!r.value&&!hasNote)return"";
    const t=(asm?BSLOT_T_ASM:BSLOT_T_STD)[code];
    const timeStr=t.e?`${t.s}–${t.e}`:t.s;
    const lbl=`${BSLOT_LABELS[code]} (${timeStr})`;
    // Only show the value suffix when there is an actual value. describeValue(null)
    // returns "free" which is meaningful in the editor banner but reads oddly here
    // when the row exists purely because of notes.
    const suffix=r.value?` — ${describeValue(r.value)}`:"";
    let line="";
    if(style==="md"){line+=`- **${lbl}**${suffix}\n`;if(note&&note.notes)line+=`  - Notes: ${note.notes}\n`}
    else if(style==="org"){line+=`- ${lbl}${suffix}\n`;if(note&&note.notes)line+=`  Notes: ${note.notes}\n`}
    else{line+=`  ${lbl}${suffix}\n`;if(note&&note.notes)line+=`    Notes: ${note.notes}\n`}
    return line;
  };
  const sep=style==="md"?"---\n\n":"";
  let out=h1(`Week Plan \u2014 ${wl}`);

  </div>;
}

/* DetailedNoteEditor: inline three-field editor used inside ClassView's quick-edit
 * panel when the user toggles to Detailed mode. Owns its own useAutoSave; flushes
 * any pending save on unmount so mode switches and panel closes never lose typing.
 */
function DetailedNoteEditor({dateKey,pid,onSave}){
  const as=useAutoSave(`note:${dateKey}:${pid}`,emptyNote(),onSave);
  const{data,updateField,saveStatus,handleFocus,handleBlur,save}=as;
  // Flush latest save on unmount — captures `save` via ref so the cleanup uses
  // the closure-current function and doesn't fire stale.
  const saveRef=useRef(save);saveRef.current=save;
  useEffect(()=>()=>saveRef.current(),[]);
  if(!data)return null;
  return<div onFocus={handleFocus} onBlur={handleBlur} style={{display:"grid",gap:8,marginTop:6}}>
    <div><label className="fl">Topic / Subject <SvH saveStatus={saveStatus}/></label><AInp data={data} field="subject" updateField={updateField} handleFocus={handleFocus} handleBlur={handleBlur} ph="e.g. Newton's 3rd Law"/></div>
    <div><label className="flb">Notes &amp; Tasks</label><AInp data={data} field="notes" updateField={updateField} handleFocus={handleFocus} handleBlur={handleBlur} ph="Lesson plan, tasks" multi rows={3}/></div>
    <div><label className="flb">Resources &amp; Links</label><AInp data={data} field="resources" updateField={updateField} handleFocus={handleFocus} handleBlur={handleBlur} ph="URLs, file names"/></div>
  </div>;
}

// WeeklyBar: vertical fill bar showing this week's planning percentage with
// theme milestones marked at 0/25/50/75/100. Used in LabView's "This Week" card.
function WeeklyBar({pct,theme}){
  const p=Math.min(100,Math.max(0,pct));
  const ms=theme.milestones;
  const barH=180;
  return(
    <div style={{display:"flex",alignItems:"stretch",gap:8,margin:"6px auto",width:"100%",maxWidth:200}}>
      <div style={{position:"relative",width:30,height:barH,background:"var(--xp-bar-bg)",borderRadius:6,overflow:"hidden",flexShrink:0}}>
        <div style={{position:"absolute",bottom:0,left:0,right:0,height:p+"%",background:"var(--xp-bar)",borderRadius:6,transition:"height .6s",boxShadow:"0 0 8px var(--xp-glow)"}}/>
      </div>
      <div style={{position:"relative",flex:1,height:barH}}>
        {ms.map((m,i)=>{const reached=p>=m.pc;return(
          <div key={i} style={{position:"absolute",bottom:m.pc+"%",left:0,right:0,display:"flex",alignItems:"center",gap:3,transform:"translateY(50%)"}}>
            <div style={{width:7,height:1.5,background:reached?"var(--xp-bar)":"var(--border)",flexShrink:0,borderRadius:1}}/>
            <span style={{fontSize:"var(--fs-nano)",color:reached?"var(--text)":"var(--text-muted)",fontWeight:reached?600:400,whiteSpace:"nowrap",lineHeight:1}}>{m.e} {m.l}</span>
          </div>
        );})}
      </div>
    </div>
  );
}

/* ═══ B-SLOT EDITOR ══════════════════════════════════════════════════════
 * BSlotChip / BSlotCell / BSlotPopup are the SettingsView pieces for editing
 * B-slot values in the timetable grid. They write straight into
 * cfg.timetable[day][slotCode]; the duty submenu pulls from cfg.duties (added
 * in step 7) and is hidden when the registry is empty.
 * ═══════════════════════════════════════════════════════════════════════
 */
function BSlotChip({value,duties}){
  if(!value)return null;
  if(value.t==="b1"){
    const t=B1_TYPES[value.c];if(!t)return null;
    return<span className="bs-chip" style={{background:`var(${t.bgVar})`,color:`var(${t.txVar})`}}>{t.icon} {t.label}</span>;
  }
  if(value.t==="duty"){
    const d=(duties||[]).find(x=>x.code===value.c);
    const bg=d&&d.color||"var(--surface)";const tx=d&&d.textColor||"var(--text-secondary)";
    return<span className="bs-chip bs-chip-duty" style={{background:bg,color:tx}}>{value.c}</span>;
  }
  if(value.t==="activity"){
    return<span className="bs-chip bs-chip-activity" title={value.tx}>{"\u{1F4CC}"} {value.tx}</span>;
  }
  return null;
}
function BSlotPopup({slotCode,day,current,duties,onPick,onClose}){
  const isB1=slotCode==="B1a"||slotCode==="B1b";
  const[view,setView]=useState("main");
  const[actText,setActText]=useState("");
  const popupRef=useRef(null);
  useEffect(()=>{
    const onDoc=e=>{if(popupRef.current&&!popupRef.current.contains(e.target))onClose()};
    const onKey=e=>{if(e.key==="Escape")onClose()};
    document.addEventListener("mousedown",onDoc);document.addEventListener("keydown",onKey);
    return()=>{document.removeEventListener("mousedown",onDoc);document.removeEventListener("keydown",onKey)};
  },[onClose]);
  const lbl=BSLOT_LABELS[slotCode]||slotCode;
  const hasDuties=(duties||[]).length>0;
  const renderActivity=()=><><button className="bs-opt" onClick={()=>setView("main")}>{"←"} Back</button>
    <div style={{padding:"4px 7px 3px",fontSize:"var(--fs-nano)",color:"var(--text-muted)",fontWeight:600,textTransform:"uppercase",letterSpacing:".05em"}}>Describe activity</div>
    <input className="bs-popup-input" autoFocus value={actText} onChange={e=>setActText(e.target.value)} placeholder="e.g. Chess club, Catchup" onKeyDown={e=>{if(e.key==="Enter"&&actText.trim()){onPick({t:"activity",tx:actText.trim()})}}}/>
    <button className="bs-popup-confirm" disabled={!actText.trim()} onClick={()=>{if(actText.trim())onPick({t:"activity",tx:actText.trim()})}}>Add</button></>;
  const renderDuty=()=><><button className="bs-opt" onClick={()=>setView("main")}>{"←"} Back</button>
    {(duties||[]).map(d=><button key={d.code} className="bs-opt" onClick={()=>onPick({t:"duty",c:d.code})}><span style={{width:8,height:8,borderRadius:"50%",background:d.color||"var(--text-muted)",flexShrink:0}}/><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"var(--fs-micro)",fontWeight:700}}>{d.code}</span><span style={{flex:1}}>{d.description||""}</span></button>)}</>;
  const renderMain=()=><>{isB1&&Object.entries(B1_TYPES).map(([k,t])=>{
    const a=current&&current.t==="b1"&&current.c===k;
    return<button key={k} className={`bs-opt${a?" active":""}`} onClick={()=>onPick({t:"b1",c:k})}><span>{t.icon}</span><span>{t.label}</span></button>;
  })}
    {hasDuties&&<button className="bs-opt" onClick={()=>setView("duty")}>{"\u{1F6E1}"} Duty…</button>}
    <button className="bs-opt" onClick={()=>setView("activity")}>{"\u{1F4CC}"} Activity…</button>
    {current&&<button className="bs-opt bs-opt-clear" onClick={()=>onPick(null)}>— Clear</button>}</>;
  return<div ref={popupRef} className="bs-popup" onClick={e=>e.stopPropagation()}>
    <div className="bs-popup-label">{lbl} · Day {day}</div>
    {view==="main"&&renderMain()}
    {view==="duty"&&renderDuty()}
    {view==="activity"&&renderActivity()}
  </div>;
}
function BSlotCell({day,slotCode,value,duties,onChange}){
  const[open,setOpen]=useState(false);

    {value?<BSlotChip value={value} duties={duties}/>:<span>—</span>}

// describeValue: human-readable summary of a B-slot value, used in the cycle-default
// caption shown above the editor and in override banners.
function describeValue(v){
  if(!v)return"free";
  if(v.t==="b1"){const t=B1_TYPES[v.c];return t?t.label:v.c}
  if(v.t==="duty")return v.c;
  if(v.t==="activity")return`Activity: ${v.tx}`;
  return"";
}
/* BSlotEditor: the inline editor inside an expanded BSlotRow. Stages a value

  const stagedDiffersFromDefault=!valEq(staged,cycleDefault);
  const stagedDiffersFromCurrent=!valEq(staged,current);
  const renderMain=()=><div className="bs-edit-options">
    {isB1&&Object.entries(B1_TYPES).map(([k,t])=>{
      const a=staged&&staged.t==="b1"&&staged.c===k;

  const noteKey=`note:${dateKey}:${slot.code}`;

  const summary=<div className={`bs-row${isGap?" gap":""}`} onClick={()=>setExpanded(e=>!e)} role="button" tabIndex={0} aria-expanded={expanded} aria-label={`${slot.label}, ${current?"set":"free"}${hasNote?", has notes":""}, ${expanded?"collapse":"expand"}`} onKeyDown={kAct(()=>setExpanded(e=>!e))}>

      <BSlotEditor slot={slot} cycleDay={cycleDay} current={current} cycleDefault={cycleDefault} clash={clash} duties={duties} onSaveToday={onSaveToday} onClose={()=>setExpanded(false)}/>

    </div>

}

          if(!next[day])next[day]={};
          next[day]={...next[day],[code]:val};
          up({[ttKey]:next});
        };
        const setP=(day,pid,v)=>{
          const next={...(cfg[ttKey]||{})};
          if(!next[day])next[day]={};
          next[day]={...next[day],[pid]:v};
          up({[ttKey]:next});
        };
        const slotLabel=(rel,extra={})=><div className="hd" style={{fontSize:"var(--fs-micro)",fontWeight:600,color:"var(--text)",display:"flex",alignItems:"center",position:"relative",...extra}}>{rel}</div>;
        const periodLabel=pid=><div className="hd" style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"var(--fs-body)",fontWeight:700,color:"var(--accent)",display:"flex",alignItems:"center"}}>{pid}</div>;
        const renderBRow=(code,label,extra)=><React.Fragment key={code}>
          {slotLabel(label,extra||{})}
          {Array.from({length:nDays},(_,di)=>{const day=di+1;const val=(tt[day]||{})[code]||null;
            return<BSlotCell key={`${day}-${code}`} day={day} slotCode={code} value={val} duties={duties} onChange={v=>setBSlot(day,code,v)}/>;
          })}
        </React.Fragment>;
        const renderPRow=pid=><React.Fragment key={pid}>
          {periodLabel(pid)}
          {Array.from({length:nDays},(_,di)=>{const day=di+1;const val=((tt[day]||{})[pid])||"";
            return<TTCombo key={`${day}-${pid}`} value={val} classes={classes} onChange={v=>setP(day,pid,v)}/>;
          })}
        </React.Fragment>;
        return<>
          {!showB0&&<button className="tt-add-row-btn" onClick={()=>setShowEdgeRows(s=>({...s,B0:true}))} style={{marginBottom:8}}>+ Before school</button>}
          <div className="tt-grid" style={{gridTemplateColumns:`84px repeat(${nDays},1fr)`,overflowX:"auto"}}>
            <div/>
            {Array.from({length:nDays},(_,i)=>{const day=i+1;const isAsm=isAsmDay(day,{timetable:tt});
              return<div key={day} className="hd" style={{textAlign:"center",fontSize:"var(--fs-caption)",fontWeight:600,color:"var(--text-muted)",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
                <span>Day {day}</span>
                {isAsm&&<span title="Assembly bell schedule (FSA on this day)" style={{color:"var(--mm-fullsch-text)",fontSize:"var(--fs-caption)"}}>{"☀"}</span>}
              </div>;
            })}
            {showB0&&renderBRow("B0","before school")}
            {renderPRow("P1")}
            {renderPRow("P2")}
            {renderBRow("B1a","after 2")}
            {renderBRow("B1b","before 3")}
            {renderPRow("P3")}
            {renderPRow("P4")}
            {renderBRow("B2a","after 4")}
            {renderBRow("B2b","before 5")}
            {renderPRow("P5")}
            {renderPRow("P6")}
            {showB3&&renderBRow("B3","after school")}
          </div>
          {!showB3&&<button className="tt-add-row-btn" onClick={()=>setShowEdgeRows(s=>({...s,B3:true}))} style={{marginTop:8}}>+ After school</button>}
        </>;
      })()}
    </div>

    <div className="card" style={{padding:18,marginBottom:14}}><div className="sl" style={{marginBottom:8}}>Duties</div><div style={{fontSize:"var(--fs-micro)",color:"var(--text-secondary)",marginBottom:10}}>Duty codes appear as pill chips in the B-slot popup above. Code is short (e.g. "GD"); description shows in Day View.</div>
      {duties.map((d,i)=><div key={i} style={{marginBottom:10,padding:10,background:"var(--surface)",borderRadius:"var(--radius-md)",border:"1px solid var(--border)"}}><div style={{display:"flex",gap:8,alignItems:"center",marginBottom:6,flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:4}}><button className="btn" onClick={()=>moveDuty(i,-1)} disabled={i===0} style={{padding:"2px 6px",fontSize:"var(--fs-micro)"}}>{"\u25b2"}</button><button className="btn" onClick={()=>moveDuty(i,1)} disabled={i===duties.length-1} style={{padding:"2px 6px",fontSize:"var(--fs-micro)"}}>{"\u25bc"}</button></div>
        <div style={{flex:"0 0 84px"}}><input className="inp mn" value={d.code} onChange={e=>updateDuty(i,"code",e.target.value.toUpperCase().replace(/\s/g,""))} placeholder="GD" style={{fontSize:"var(--fs-body)",fontWeight:700,textAlign:"center",background:d.color,color:d.textColor||TEXT_FOR_BG[d.color]||"#000",borderRadius:10}}/></div>
        <div style={{flex:1,minWidth:140}}><input className="inp" value={d.description} onChange={e=>updateDuty(i,"description",e.target.value)} placeholder="Description (e.g. Gate duty)" style={{fontSize:"var(--fs-caption)"}}/></div>
        <button className="btn" onClick={()=>up({duties:duties.filter((_,j)=>j!==i)})} style={{padding:"2px 8px",color:"var(--error)",fontSize:"var(--fs-caption)"}}>{"\u2715"}</button></div>
        <ColourPicker value={d.color} onChange={col=>updateDuty(i,"color",col)} usedColours={usedDutyColours}/></div>)}
      <button className="btn" onClick={addDuty}>+ Add duty</button>{duties.length===0&&<div style={{fontSize:"var(--fs-caption)",color:"var(--text-muted)",marginTop:8,fontStyle:"italic"}}>No duties defined yet.</div>}</div>

    <div className="card" style={{padding:18,marginBottom:14}}><div className="sl" style={{marginBottom:8}}>Weekly activities</div><div style={{fontSize:"var(--fs-micro)",color:"var(--text-secondary)",marginBottom:10}}>Activities that repeat on a weekday regardless of cycle day (e.g. Chess Club every Wednesday). Each entry occupies one B-slot on one weekday. To repeat the same activity across multiple weekdays, add separate entries.</div>
      {weeklyEvents.map((e,i)=><div key={i} style={{marginBottom:10,padding:10,background:"var(--surface)",borderRadius:"var(--radius-md)",border:"1px solid var(--border)",display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <select className="inp" value={e.weekday} onChange={ev=>updateWeekly(i,"weekday",Number(ev.target.value))} style={{flex:"0 0 110px",fontSize:"var(--fs-body)"}}>
          {[[1,"Monday"],[2,"Tuesday"],[3,"Wednesday"],[4,"Thursday"],[5,"Friday"]].map(([v,l])=><option key={v} value={v}>{l}</option>)}
        </select>
        <select className="inp" value={e.slot} onChange={ev=>updateWeekly(i,"slot",ev.target.value)} style={{flex:"0 0 130px",fontSize:"var(--fs-body)"}}>
          {["B0","B1a","B1b","B2a","B2b","B3"].map(c=><option key={c} value={c}>{BSLOT_LABELS[c]}</option>)}
        </select>
        <div style={{flex:1,minWidth:140}}><input className="inp" value={e.text} onChange={ev=>updateWeekly(i,"text",ev.target.value)} placeholder="e.g. Chess Club" style={{fontSize:"var(--fs-body)"}}/></div>
        <button className="btn" onClick={()=>deleteWeekly(i)} style={{padding:"2px 8px",color:"var(--error)",fontSize:"var(--fs-caption)"}}>{"✕"}</button>
      </div>)}
      <button className="btn" onClick={addWeekly}>+ Add weekly activity</button>{weeklyEvents.length===0&&<div style={{fontSize:"var(--fs-caption)",color:"var(--text-muted)",marginTop:8,fontStyle:"italic"}}>No weekly activities defined yet.</div>}</div>

    <div style={{display:"flex",gap:8,alignItems:"center"}}><button className="btn-a" onClick={doSave}>Save Configuration</button>{saved&&<span style={{fontSize:"var(--fs-body)",color:"var(--success)",fontWeight:600}}>{"\u2713"} Saved</span>}</div>
    {showFab&&<button onClick={()=>window.scrollTo({top:0,behavior:"smooth"})} title="Back to top" aria-label="Back to top" style={{position:"fixed",bottom:24,right:24,width:44,height:44,borderRadius:"50%",background:"var(--accent)",color:"var(--on-accent,#fff)",border:"none",cursor:"pointer",fontSize:"var(--fs-title)",fontWeight:700,boxShadow:"0 4px 12px rgba(0,0,0,.18)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>{"\u2191"}</button>}
    </div>;
}

/* ═══ DATA PANEL ═════════════════════════════════════════════════════════ */
/* ═══ DATA PANEL ═════════════════════════════════════════════════════════
 * DataPanel: modal overlay accessed via the floppy-disk button. Three areas:
 *
 *   Cloud Sync — connect to a GitHub Gist (with preview before adopting),
 *                manual Push / Pull / Disconnect. Pulls run through
 *                checkSyncConflict and surface a confirmation if the gist
 *                appears stale, smaller, or from a newer schema version.
 *
 *   Export     — download a JSON backup of all notes, daymeta, and config.
 *
 *   Import     — choose a backup file; it is parsed, validated against
 *                the key allowlist (NOTE_KEY_RE / META_KEY_RE / _config),
 *                and the user confirms before any data is written.
 * ═══════════════════════════════════════════════════════════════════════
 */
function DataPanel({onClose,onImported,onSync,onSyncConn,onSyncDisc,lastSync,token,gistId,setToken,setGistId}){
  const[iSt,setISt]=useState(null);const[iData,setIData]=useState(null);const[iStats,setIStats]=useState(null);const fRef=useRef(null);
  const[showTok,setShowTok]=useState(false);const[syncMsg,setSyncMsg]=useState(null);const[parseErr,setParseErr]=useState("");
  // Preview shown when connecting to a non-empty Gist ID, so the user can see what they're about to adopt before it overwrites local data.
  const[connPreview,setConnPreview]=useState(null);
  const connected=token&&gistId;
  const doExport=()=>{const data=getAllData();const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`planner-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);localStorage.setItem("planner-last-backup",new Date().toISOString())};
  // Parse a backup file but only count keys that match the import allowlist; everything else is reported as "skipped" so the user knows nothing unexpected can sneak through.
  const handleFile=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const parsed=JSON.parse(ev.target.result);if(!parsed||typeof parsed!=="object"||Array.isArray(parsed))throw new Error("Not a valid backup object");const ver=parsed._meta&&parsed._meta.version;if(typeof ver==="number"&&ver>SCHEMA_VERSION)throw new Error(`This backup is from a newer version of the planner (v${ver}). Please update before importing.`);const ks=Object.keys(parsed);const n=ks.filter(k=>NOTE_KEY_RE.test(k)).length;const m=ks.filter(k=>META_KEY_RE.test(k)).length;const skipped=ks.filter(k=>k!=="_meta"&&k!=="_config"&&!NOTE_KEY_RE.test(k)&&!META_KEY_RE.test(k));setIData(parsed);setIStats({hasCfg:!!parsed._config,n,m,skipped});setISt("confirm");setParseErr("")}catch(err){setISt("error");setIData(null);setIStats(null);setParseErr(err.message||"Invalid file")}};reader.readAsText(file);e.target.value=""};
  const doImport=()=>{if(!iData)return;const result=importAllData(iData);if(result.error){setISt("error");setParseErr(result.error);return}setISt("done");setIStats(s=>({...s,imported:result.imported,skippedDetail:result.skipped}));onImported()};
  // Connect: if a Gist ID is supplied, pull and show a preview before adopting it. This stops a phished/copied Gist ID from silently replacing the user's data.
  const doConn=()=>{
    if(!token){setSyncMsg({type:"error",text:"Enter a token first"});return}
    setSyncMsg({type:"info",text:gistId?"Verifying...":"Creating new Gist..."});
    if(gistId){
      gistPull(token,gistId).then(data=>{
        if(!data||typeof data!=="object"){setSyncMsg({type:"error",text:"Gist content is not a valid backup"});return}
        const remoteN=Object.keys(data).filter(k=>NOTE_KEY_RE.test(k)).length;
        const remoteM=Object.keys(data).filter(k=>META_KEY_RE.test(k)).length;
        const remoteSchool=data._config&&data._config.school||"(no school name)";
        const remoteSynced=data._meta&&data._meta.synced||null;
        const localN=Object.keys(localStorage).filter(k=>k.startsWith("note:")).length;
        const localM=Object.keys(localStorage).filter(k=>k.startsWith("daymeta:")).length;
        setConnPreview({remoteN,remoteM,localN,localM,remoteSchool,remoteSynced});
        setSyncMsg(null);
      }).catch(()=>setSyncMsg({type:"error",text:"Could not access Gist"}));
    }else{
      const data=getAllData();
      gistCreate(token,data).then(nid=>{
        setGistId(nid);
        // Use the same timestamp we just embedded in the gist so the next pull sees them as equal.
        localStorage.setItem("planner-last-sync",data._meta.synced);
        setSyncMsg({type:"ok",text:"Created Gist: "+nid.slice(0,8)+"..."});
        if(onSyncConn)onSyncConn(token,nid);
      }).catch(()=>setSyncMsg({type:"error",text:"Failed. Check token has gist scope."}));
    }
  };
  const confirmConn=()=>{setConnPreview(null);setSyncMsg({type:"ok",text:"Connected"});if(onSyncConn)onSyncConn(token,gistId)};
  const cancelConn=()=>{setConnPreview(null);setSyncMsg(null)};
  const doDisc=()=>{setToken("");setGistId("");setSyncMsg({type:"info",text:"Disconnected"});if(onSyncDisc)onSyncDisc()};
  // Push and Pull now run the same convergence (the App's merge sync). Both are
  // kept as buttons so the control is familiar, but neither can clobber: each one
  // fetches, merges per record, and writes the result back. No more "overwrite
  // local / keep local" prompt, because pulling can no longer lose work.
  const doSync=()=>{
    if(!token||!gistId)return;
    setSyncMsg({type:"info",text:"Syncing..."});
    Promise.resolve(onSync&&onSync()).then(s=>{
      setSyncMsg(s==="synced"?{type:"ok",text:"Synced \u2713"}
        :s==="conflict"?{type:"error",text:"Gist is from a newer planner version; update first"}
        :{type:"error",text:"Sync failed"});
    });
  };
  const cn=Object.keys(localStorage).filter(k=>k.startsWith("note:")).length;const cm=Object.keys(localStorage).filter(k=>k.startsWith("daymeta:")).length;
  const smc=syncMsg?(syncMsg.type==="ok"?"var(--success)":syncMsg.type==="error"?"var(--error)":"var(--text-muted)"):"";
  return<div className="overlay" onClick={onClose}><div onClick={e=>e.stopPropagation()} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:"var(--radius-lg)",padding:20,minWidth:300,maxWidth:460,maxHeight:"90vh",overflowY:"auto"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}><span className="hd" style={{fontWeight:600,color:"var(--text)",fontSize:"var(--fs-emph)"}}>{"\u2699\uFE0F"} Data & Sync</span><button onClick={onClose} style={{background:"none",border:"none",color:"var(--text-secondary)",fontSize:"var(--fs-title)",cursor:"pointer"}}>{"\u2715"}</button></div>
    <div style={{fontSize:"var(--fs-caption)",color:"var(--text-secondary)",marginBottom:14,padding:"8px 10px",background:"var(--surface)",borderRadius:"var(--radius-md)"}}><div style={{marginBottom:4,fontWeight:600,color:"var(--text)"}}>Current data</div><span className="mn">{cn}</span> notes {"\u00B7"} <span className="mn">{cm}</span> day settings</div>
    <div style={{marginBottom:16}}><div className="sl" style={{marginBottom:8}}>{"\u2601\uFE0F"} Cloud Sync</div>
      {connected?<div><div style={{fontSize:"var(--fs-caption)",color:"var(--success)",marginBottom:8,display:"flex",alignItems:"center",gap:6}}><span style={{width:8,height:8,borderRadius:"50%",background:"var(--success)"}}/>Connected: <span className="mn" title="Click to copy full ID" onClick={()=>navigator.clipboard&&navigator.clipboard.writeText(gistId)} style={{fontSize:"var(--fs-nano)",color:"var(--accent)",cursor:"pointer",textDecoration:"underline",wordBreak:"break-all"}}>{gistId.slice(0,8)}{"…"}</span></div><div style={{display:"flex",gap:6,flexWrap:"wrap"}}><Btn onClick={doSync}>{"\u2B06"} Push</Btn><Btn onClick={doSync}>{"\u2B07"} Pull</Btn><Btn onClick={doDisc} style={{color:"var(--error)"}}>{"\u2715"} Disconnect</Btn></div>{lastSync&&<div style={{fontSize:"var(--fs-nano)",color:"var(--text-muted)",marginTop:6}}>Last sync: {lastSync}</div>}<div style={{fontSize:"var(--fs-nano)",color:"var(--text-muted)",marginTop:6,lineHeight:1.4}}>Push and Pull both merge with the gist now, so neither loses work.</div></div>
      :<div><div style={{fontSize:"var(--fs-caption)",color:"var(--text-secondary)",marginBottom:8,lineHeight:1.5}}>Connect to GitHub Gist for cross-device sync. <a href="https://github.com/settings/tokens/new?scopes=gist&description=Lesson+Planner" target="_blank" rel="noopener" style={{color:"var(--accent)"}}>Create token {"\u2197"}</a></div><div style={{marginBottom:6}}><label className="fl">Token</label><div style={{display:"flex",gap:4}}><input className="inp" type={showTok?"text":"password"} value={token} onChange={e=>setToken(e.target.value)} placeholder="ghp_xxxx..." style={{fontSize:"var(--fs-caption)",flex:1}}/><Btn onClick={()=>setShowTok(!showTok)} style={{padding:"4px 8px",fontSize:"var(--fs-micro)"}}>{showTok?"\u{1F441}":"\u2022\u2022\u2022"}</Btn></div></div><div style={{marginBottom:8}}><label className="fl">Gist ID <span style={{fontWeight:400,color:"var(--text-muted)"}}>(blank = create new)</span></label><input className="inp" value={gistId} onChange={e=>setGistId(e.target.value)} placeholder="Leave empty for new" style={{fontSize:"var(--fs-caption)"}}/></div><button className="btn-a" onClick={doConn} disabled={!!connPreview}>{"\u{1F517}"} Connect</button>{connPreview&&<div style={{marginTop:10,padding:10,background:"var(--surface)",borderRadius:6,border:"1px solid var(--accent)"}}><div style={{fontSize:"var(--fs-body)",color:"var(--accent)",fontWeight:600,marginBottom:6}}>Preview: this Gist contains</div><div style={{fontSize:"var(--fs-micro)",color:"var(--text-secondary)",lineHeight:1.6,marginBottom:8}}>School: <strong>{connPreview.remoteSchool}</strong><br/><span className="mn">{connPreview.remoteN}</span> notes {"·"} <span className="mn">{connPreview.remoteM}</span> day settings{connPreview.remoteSynced&&<><br/>Last synced: {new Date(connPreview.remoteSynced).toLocaleString("en-NZ")}</>}</div>{(connPreview.localN+connPreview.localM>0)&&<div style={{fontSize:"var(--fs-micro)",color:"var(--flag)",marginBottom:8,padding:"6px 8px",background:"var(--card)",borderRadius:4,border:"1px solid var(--flag)"}}>{"⚠"} Your local data ({connPreview.localN} notes, {connPreview.localM} day settings) will be replaced on the next pull.</div>}<div style={{display:"flex",gap:6}}><button className="btn-a" onClick={confirmConn} style={{padding:"6px 14px"}}>{"✓"} Use this Gist</button><Btn onClick={cancelConn}>Cancel</Btn></div></div>}</div>}
      {syncMsg&&<div style={{fontSize:"var(--fs-micro)",color:smc,marginTop:8,padding:"4px 8px",background:"var(--surface)",borderRadius:4}}>{syncMsg.text}</div>}</div>
    <div style={{marginBottom:16}}><div className="sl" style={{marginBottom:8}}>Export</div><Btn onClick={doExport}>{"\u{1F4E5}"} Download Backup</Btn></div>
    <div><div className="sl" style={{marginBottom:8}}>Import</div>      <input ref={fRef} type="file" accept=".json,application/json,text/plain,.txt" onChange={handleFile} style={{display:"none"}}/>
      {iSt===null&&<Btn onClick={()=>fRef.current&&fRef.current.click()}>{"\u{1F4E4}"} Choose File</Btn>}
      {iSt==="confirm"&&iStats&&<div style={{padding:10,background:"var(--surface)",borderRadius:6,border:"1px solid var(--accent)"}}><div style={{fontSize:"var(--fs-caption)",color:"var(--text-secondary)",marginBottom:8}}>{iStats.hasCfg&&<span style={{color:"var(--success)",fontWeight:600}}>Config found {"\u2713"} </span>}<span className="mn">{iStats.n}</span> notes {"\u00B7"} <span className="mn">{iStats.m}</span> day settings</div>{iStats.skipped&&iStats.skipped.length>0&&<div style={{fontSize:"var(--fs-nano)",color:"var(--flag)",marginBottom:8,padding:"6px 8px",background:"var(--card)",borderRadius:4,border:"1px solid var(--flag)"}}>{"⚠"} {iStats.skipped.length} unrecognised {iStats.skipped.length===1?"key":"keys"} will be ignored: <span className="mn" style={{wordBreak:"break-all"}}>{iStats.skipped.slice(0,3).join(", ")}{iStats.skipped.length>3?", ...":""}</span></div>}<div style={{display:"flex",gap:8}}><button className="btn-a" onClick={doImport} style={{padding:"6px 14px"}}>{"\u2713"} Confirm</button><Btn onClick={()=>{setISt(null);setIData(null);setIStats(null)}}>Cancel</Btn></div></div>}
      {iSt==="done"&&iStats&&<div style={{padding:10,background:"var(--surface)",borderRadius:6,border:"1px solid var(--success)"}}><div style={{fontSize:"var(--fs-body)",color:"var(--success)",fontWeight:600}}>{"\u2713"} Imported <span className="mn">{iStats.imported}</span> entries</div>{iStats.skippedDetail&&iStats.skippedDetail.length>0&&<div style={{fontSize:"var(--fs-nano)",color:"var(--text-muted)",marginTop:6}}>{iStats.skippedDetail.length} skipped (rejected by validator)</div>}<Btn onClick={onClose} style={{marginTop:8}}>Close</Btn></div>}
      {iSt==="error"&&<div style={{padding:10,background:"var(--surface)",borderRadius:6,border:"1px solid var(--error)"}}><div style={{fontSize:"var(--fs-body)",color:"var(--error)",fontWeight:600}}>{"\u26A0"} Import failed</div>{parseErr&&<div style={{fontSize:"var(--fs-nano)",color:"var(--text-muted)",marginTop:6,wordBreak:"break-all",fontFamily:"'JetBrains Mono',monospace",lineHeight:1.4}}>{parseErr}</div>}<Btn onClick={()=>{setISt(null);setParseErr("");fRef.current&&fRef.current.click()}} style={{marginTop:8}}>Try another</Btn></div>}
    </div></div></div>;
}

/* ═══ APP ═════════════════════════════════════════════════════════════════ */
/* ═══ APP ═══════════════════════════════════════════════════════════════
 * App: the root component. Holds:
 *
 *   - cfg / eng     — the config and the derived date engine
 *   - view          — which top-level view is showing (term/week/day/...)
 *   - metaCache, mcR       — daymeta cache (state for re-render + ref for stable callbacks)
 *   - planWN        — the "current week" used as the gamification reference
 *   - gam           — gamification snapshot (re-memoed on every save via gr counter)
 *   - dispMode      — display mode (light/dark/light-hc/dark-hc)
 *   - syncSt        — sync indicator state ("idle" / "syncing" / "synced" / "error" / "conflict")
 *   - storageFailed — whether the storage-quota banner is visible
 *
 * Effects: gist startup auto-pull, multi-tab storage event listener,
 * window globals (_plannerSync, _plannerGamRefresh) used by useAutoSave
 * to fire side effects without prop drilling.
 * ═══════════════════════════════════════════════════════════════════════
 */
/* ═══ GLOBAL SEARCH ════════════════════════════════════════════════════════
 * SearchOverlay: a modal that scans every note: and daymeta: value in
 * localStorage and lets you jump to any lesson, note, or reflection by text.
 * Pure read of localStorage; adds no stored state. Closes on Escape, backdrop
 * click, or a result tap (which navigates via onGo → goDay).
 * ═══════════════════════════════════════════════════════════════════════ */
function SearchOverlay({eng,onGo,onClose}){
  const[q,setQ]=useState("");
  const inputRef=useRef(null);
  useEffect(()=>{if(inputRef.current)inputRef.current.focus()},[]);
  useEffect(()=>{const onKey=e=>{if(e.key==="Escape")onClose()};window.addEventListener("keydown",onKey);return()=>window.removeEventListener("keydown",onKey)},[onClose]);
  const term=q.trim().toLowerCase();
  const results=useMemo(()=>{
    if(term.length<2)return[];
    const parseDk=s=>{const p=s.split("-");return new Date(+p[0],+p[1],+p[2])};
    const SL={B0:"before school",B1a:"after 2",B1b:"before 3",B2a:"after 4",B2b:"before 5",B3:"after school"};
    const out=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);if(!k)continue;
      if(k.slice(0,5)==="note:"){

// CONTENT_MAX: one max width for the centred content wrapper, shared by every view
// (v2.16.1). This deliberately replaces the earlier per-view widths: a centred column of
// varying width re-centres when you switch views, sliding the whole frame (nav included)
// sideways on a wide screen. A single width keeps the layout perfectly still across tabs.
// Below this width the wrapper is capped by the viewport, so phones/tablets are unchanged.
const CONTENT_MAX=1000;
// ErrorBoundary: wraps the active view only (NOT the whole app), so a render crash in one
// view degrades to a recovery card while the header and tabs keep working. React error
// boundaries must be class components (getDerivedStateFromError / componentDidCatch). The
// boundary is keyed on `view` in App, so switching tabs remounts it and clears the error.
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null}}
  static getDerivedStateFromError(err){return{err}}
  componentDidCatch(err,info){console.error("View render crashed:",err,info)}
  // dl: download a full backup from the crash card, reusing doExport's blob pattern. getAllData
  // reads straight from localStorage, so it works even though the view component threw.
  dl(){try{const data=getAllData();const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`planner-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url)}catch(e){console.error("Backup from crash card failed:",e)}}
  render(){
    if(this.state.err){
      const msg=String(this.state.err&&this.state.err.message||this.state.err);
      return<div className="card" style={{padding:"20px 22px",border:"1px solid var(--error)"}}>
        <div className="hd" style={{fontSize:"var(--fs-title)",fontWeight:600,color:"var(--error)",marginBottom:8}}>{"⚠"} Something went wrong displaying this view</div>
        <div style={{fontSize:"var(--fs-body)",color:"var(--text-secondary)",lineHeight:1.6,marginBottom:14}}>Your data is safe on this device. You can download a backup and reload; switching to another tab above may also clear this.</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
          <button className="btn-a" onClick={()=>this.dl()} style={{padding:"6px 14px",fontSize:"var(--fs-body)"}}>{"\u{1F4E5}"} Download Backup</button>
          <button className="btn" onClick={()=>window.location.reload()} style={{padding:"6px 14px",fontSize:"var(--fs-body)"}}>{"↻"} Reload</button>
        </div>
        <div className="mn" style={{fontSize:"var(--fs-nano)",color:"var(--text-muted)",wordBreak:"break-word"}}>{msg}</div>
      </div>;
    }
    return this.props.children;
  }
}

    <div className="np" style={{marginBottom:16,borderBottom:"1px solid var(--border)",paddingBottom:14}}>
      <div style={{marginBottom:10}}>
        <div className="hd" style={{fontSize:"var(--fs-display)",fontWeight:400,color:"var(--accent)",letterSpacing:"-.3px"}}>{"\u{1F4C5}"} {eng.school} Planner</div>
        <div style={{fontSize:"var(--fs-caption)",color:"var(--text-muted)"}}>{cfg.userName&&<span style={{color:"var(--text-secondary)",fontWeight:500}}>{cfg.userName} {"\u00B7"} </span>}{gam.lev.icon} {gam.lev.title}{gam.sk>0&&<span style={{color:"var(--success)",marginLeft:8}}>{"\u{1F525}"} {gam.sk}wk streak</span>}{onWE&&<span style={{color:"var(--accent)",fontStyle:"italic",marginLeft:8}}>Weekend mode</span>}</div>
        <div style={{fontSize:"var(--fs-nano)",color:"var(--text-muted)",marginTop:3}}>v{APP_VERSION} {"·"} <a href="guide.html" target="_blank" rel="noopener" style={{color:"var(--accent)"}}>Guide</a> {"·"} <a href="https://github.com/vcanela/lesson-planner/blob/main/CHANGELOG.md" target="_blank" rel="noopener" style={{color:"var(--accent)"}}>Changelog</a></div>
      </div>
      <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:3,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius-md)",padding:3}}>{TABS.map(tabBtn)}</div>
        {compact&&<div style={{display:"flex",gap:6,alignItems:"center",marginLeft:"auto",position:"relative"}}>
          <button onClick={()=>setNavMenu(v=>!v)} title="More" style={{...utilBtnStyle,fontWeight:700}}>{"\u22EF"}{syncDot}</button>
          {navMenu&&<div className="navmenu">
            <button className="navmenu-item" onClick={()=>{setShowSearch(true);setNavMenu(false)}}>{"\u{1F50D}"} Search</button>
            <button className="navmenu-item" onClick={toggleTheme}>{dispMode.startsWith("dark")?"\u2600\uFE0F":"\u{1F319}"} {dispMode.startsWith("dark")?"Day mode":"Night mode"}</button>
            <button className="navmenu-item" onClick={()=>{setShowDP(true);setNavMenu(false)}}>{"\u{1F4BE}"} Data & Sync</button>
            <div className="navmenu-note" style={{color:nudge.amber?"var(--error)":"var(--text-muted)"}}>{nudge.amber?"\u26A0 ":""}{nudge.text}</div>
          </div>}
        </div>}
        {!compact&&<React.Fragment>
        <button onClick={()=>setShowSearch(true)} title="Search all notes" style={{background:"var(--surface)",border:"1px solid var(--border)",color:"var(--text)",borderRadius:"var(--radius-sm)",padding:"5px 10px",cursor:"pointer",fontSize:"var(--fs-title)",lineHeight:1}}>{"\u{1F50D}"}</button>
        <button onClick={()=>{const dk=dispMode.startsWith("dark"),hc=dispMode.endsWith("-hc");setDispMode((dk?"light":"dark")+(hc?"-hc":""))}} title={dispMode.startsWith("dark")?"Switch to day mode":"Switch to night mode"} style={{background:"var(--surface)",border:"1px solid var(--border)",color:"var(--text)",borderRadius:"var(--radius-sm)",padding:"5px 10px",cursor:"pointer",fontSize:"var(--fs-title)",lineHeight:1}}>{dispMode.startsWith("dark")?"☀️":"\u{1F319}"}</button>
        <button onClick={()=>setShowDP(true)} title={syncSt==="conflict"?"Sync conflict — open to resolve":"Data & Sync"} style={{background:"var(--surface)",border:"1px solid var(--border)",color:"var(--text)",borderRadius:"var(--radius-sm)",padding:"5px 10px",cursor:"pointer",fontSize:"var(--fs-title)",lineHeight:1,position:"relative"}}>{"\u{1F4BE}"}{syncConnected()&&<span style={{position:"absolute",top:2,right:2,width:7,height:7,borderRadius:"50%",background:syncSt==="syncing"?"var(--accent)":syncSt==="synced"?"var(--success)":syncSt==="error"?"var(--error)":syncSt==="conflict"?"var(--flag)":"var(--success)",border:"1px solid var(--card)"}}/>}</button>
        {/* Sync-aware backup nudge: synced users are covered (the dot says so); users
            without sync get a backup-recency reminder that turns amber after ~2 weeks. */}
        {(()=>{
          let amber=false,text;
          if(syncConnected()){if(syncSt==="error"){amber=true;text="Sync error"}else{text="Synced"}}
          else{const lb=localStorage.getItem("planner-last-backup");
            if(!lb){amber=true;text="Not backed up"}
            else{const days=Math.floor((Date.now()-Date.parse(lb))/864e5);
              if(days<=0)text="Backed up today";else{text=`Backup ${days}d ago`;if(days>=14)amber=true}}}
          return<button onClick={()=>setShowDP(true)} title="Backup and sync status. Click to back up or set up cloud sync." style={{background:"none",border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:"var(--fs-nano)",lineHeight:1.1,whiteSpace:"nowrap",padding:"0 2px",color:amber?"var(--error)":"var(--text-muted)",fontWeight:amber?600:400}}>{amber?"⚠ ":""}{text}</button>;
        })()}
        </React.Fragment>}
      </div>
    </div>
    {storageFailed&&<div className="card" style={{padding:"12px 16px",marginBottom:14,border:"1px solid var(--error)",background:"var(--surface)",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}><span style={{fontSize:"var(--fs-title)"}}>{"⚠"}</span><div style={{flex:1,minWidth:200}}><div className="hd" style={{fontSize:"var(--fs-emph)",fontWeight:600,color:"var(--error)"}}>Browser storage is full</div><div style={{fontSize:"var(--fs-caption)",color:"var(--text-secondary)",lineHeight:1.5}}>Recent changes have not been saved. Cloud sync is paused while this is unresolved. Open the Data Panel to download a backup, then clear old data in your browser settings.</div></div><button className="btn-a" onClick={()=>setShowDP(true)} style={{padding:"6px 14px",fontSize:"var(--fs-body)"}}>Open Data Panel</button><button className="btn" onClick={()=>{storageFailedRef.current=false;setStorageFailed(false)}} style={{padding:"4px 10px",fontSize:"var(--fs-caption)",color:"var(--text-muted)"}}>Dismiss</button></div>}
    {(cfg&&(!cfg.classes||cfg.classes.length===0||!cfg.timetable||Object.keys(cfg.timetable).length===0))&&<div className="card" style={{padding:"14px 18px",marginBottom:14,border:"1px solid var(--dz-border)",background:"var(--dz-bg)",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}><span style={{fontSize:"var(--fs-title)"}}>{"\u{1F44B}"}</span><div style={{flex:1,minWidth:200}}><div className="hd" style={{fontSize:"var(--fs-emph)",fontWeight:600,color:"var(--dz-text)"}}>Welcome! Add your classes and timetable</div><div style={{fontSize:"var(--fs-caption)",color:"var(--dz-text)",opacity:.8}}>Term dates and holidays are already set up. Head to Setup to add your classes and timetable.</div></div><button className="btn-a" onClick={()=>{setView("setup");setGR(r=>r+1)}} style={{padding:"6px 14px",fontSize:"var(--fs-body)"}}>Go to Setup {"\u2192"}</button></div>}
    {showSearch&&<SearchOverlay eng={eng} onGo={goDay} onClose={()=>setShowSearch(false)}/>}
    {showDP&&<DataPanel onClose={()=>setShowDP(false)} onImported={handleImport} onSync={syncNow} onSyncConn={(tok,gid)=>{setGhToken(tok);setGhGistId(gid);triggerSync()}} onSyncDisc={()=>{setGhToken("");setGhGistId("");clearTimeout(syncTimer.current);setSyncSt("idle");setLastSync(null)}} lastSync={lastSync} token={ghToken} gistId={ghGistId} setToken={setGhToken} setGistId={setGhGistId}/>}
    <ErrorBoundary key={view}>
    {view==="term"&&<TermView onDay={goDay} onWk={goWk} metaCache={metaCache} gam={gam} cfg={cfg}/>}
    {view==="week"&&<WeekView base={base} setBase={setBase} onDet={(d,pid)=>goDay(d,pid)} metaCache={metaCache} updateMeta={updateMeta} gam={gam} onUpdateCfg={onUpdateCfg} cfg={cfg}/>}
    {view==="day"&&detDate&&<DayView date={detDate} setDate={d=>{setDetDate(d);setFP(null);setView("day")}} onBack={()=>{setFP(null);setGR(r=>r+1);setView(prevV==="day"?"week":prevV)}} metaCache={metaCache} onMS={onMS} fp={fp} gam={gam} onUpdateCfg={onUpdateCfg} cfg={cfg}/>}
    {view==="class"&&<ClassView onDet={(d,pid)=>goDay(d,pid)} gam={gam}/>}
    {view==="lab"&&<LabView gam={gam}/>}
    {view==="setup"&&<SettingsView onSave={newCfg=>{setCfg(newCfg);setGR(r=>r+1)}} displayMode={dispMode} setDisplayMode={setDispMode}/>}
    </ErrorBoundary>
  </div></div></CfgCtx.Provider>;
}

// Run schema migrations once before React mounts. migrateConfig is also called inside
// useState initialisers as a safety net, but pre-running it here ensures the localStorage
// shape is canonical before any view reads it.
migrateConfig(storageGet("planner-config"));
migrateStorage();
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
