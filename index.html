<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="light"]{
--page:#FAF8F5;--card:#FFFFFF;--surface:#F0ECE6;--surface-open:#EAE5DC;
--border:#E8E4DD;--border-hover:#D8D2C8;
--text:#3D3630;--text-secondary:#7A7268;--text-muted:#9C9488;
--today-bg:#EDE7DC;--today-border:#7C6B5A;
--dz-bg:#FEF3CC;--dz-border:#C9A84C;--dz-text:#7A5A20;
--accent:#7C6B5A;--accent-light:#EDE7DC;--success:#3D6B35;--error:#8B3030;
--break-bg:#F0ECE6;--break-text:#9C9488;
--input-bg:#FAF8F5;--input-border:#D8D2C8;--input-focus:#7C6B5A;
--row-open:#EDE7DC;--nc-bg:#E8E4DD;--nc-text:#9C9488;
--mm-tutor-bg:#D4E4CC;--mm-tutor-text:#2E5426;
--mm-deans-bg:#EDD9B5;--mm-deans-text:#7A5A20;
--mm-fullsch-bg:#D8CCE4;--mm-fullsch-text:#4A2E6B;
--mm-chapel-bg:#BCD0E0;--mm-chapel-text:#2A4A6B;
--flag:#B87830;--bar-empty:#D8D2C8;
--xp-bar:#7C6B5A;--xp-bar-bg:#E8E4DD;--xp-glow:rgba(124,107,90,.15);
--cal-sel:#7C6B5A;--cal-sel-text:#FFFFFF;--cal-hover:#EDE7DC;--cal-we:#F0ECE6;
--on-accent:#FFFFFF;
--radius-sm:6px;--radius-md:10px;--radius-lg:14px;
/* Type scale (v2.10.0): a 7-step ramp replacing ~40 ad-hoc font sizes. Simple
   steps composing upward; floor for interactive/content text is --fs-micro, with
   --fs-nano reserved for decorative sublabels. Theme-independent, so it lives in
   :root and is not overridden by the dark/high-contrast blocks. */
--fs-nano:.62rem;--fs-micro:.68rem;--fs-caption:.72rem;--fs-body:.78rem;--fs-emph:.9rem;--fs-title:1.1rem;--fs-display:1.35rem;
}
[data-theme="dark"]{
--page:#1A1816;--card:#221F1C;--surface:#161412;--surface-open:#2A2622;
--border:#3A3530;--border-hover:#4A443C;
--text:#E8E2D8;--text-secondary:#8A8278;--text-muted:#5C564E;
--today-bg:#2E2820;--today-border:#B8A690;
--dz-bg:#2A2210;--dz-border:#5C4A20;--dz-text:#C9A84C;
--accent:#B8A690;--accent-light:#2E2820;--success:#4A8040;--error:#8B3030;
--break-bg:#161412;--break-text:#5C564E;
--input-bg:#161412;--input-border:#3A3530;--input-focus:#B8A690;
--row-open:#2A2622;--nc-bg:#2E2A26;--nc-text:#6A645C;
--mm-tutor-bg:#1E2A1A;--mm-tutor-text:#7AC06A;
--mm-deans-bg:#2E2810;--mm-deans-text:#C4A850;
--mm-fullsch-bg:#221A2E;--mm-fullsch-text:#A880D0;
--mm-chapel-bg:#1A222E;--mm-chapel-text:#6AAAC8;
--flag:#D49040;--bar-empty:#3A3530;
--xp-bar:#B8A690;--xp-bar-bg:#2A2622;--xp-glow:rgba(184,166,144,.2);
--cal-sel:#B8A690;--cal-sel-text:#000000;--cal-hover:#2A2622;--cal-we:#1E1C18;
--on-accent:#000000;
--radius-sm:6px;--radius-md:10px;--radius-lg:14px;
}
[data-theme="light-hc"]{
--page:#FFFFFF;--card:#FFFFFF;--surface:#F0F0F0;--surface-open:#E6E6E6;
--border:#888888;--border-hover:#555555;
--text:#000000;--text-secondary:#333333;--text-muted:#555555;
--today-bg:#D6EAFF;--today-border:#0072A8;
--dz-bg:#FFF3C4;--dz-border:#D55E00;--dz-text:#8B3A00;
--accent:#0072A8;--accent-light:#D6EAFF;--success:#009E73;--error:#D55E00;
--break-bg:#F0F0F0;--break-text:#555555;
--input-bg:#FFFFFF;--input-border:#888888;--input-focus:#0072A8;
--row-open:#E8F4FF;--nc-bg:#E0E0E0;--nc-text:#333333;
--mm-tutor-bg:#C8F0C8;--mm-tutor-text:#005C2E;
--mm-deans-bg:#FFE0A0;--mm-deans-text:#7A4000;
--mm-fullsch-bg:#E8C8F0;--mm-fullsch-text:#4A0072;
--mm-chapel-bg:#B8D8F0;--mm-chapel-text:#003860;
--flag:#D55E00;--bar-empty:#AAAAAA;
--xp-bar:#0072A8;--xp-bar-bg:#D0D0D0;--xp-glow:rgba(0,114,168,.2);
--cal-sel:#0072A8;--cal-sel-text:#FFFFFF;--cal-hover:#D6EAFF;--cal-we:#F0F0F0;
--on-accent:#FFFFFF;
--radius-sm:6px;--radius-md:10px;--radius-lg:14px;
}
[data-theme="dark-hc"]{
--page:#000000;--card:#1A1A1A;--surface:#111111;--surface-open:#222222;
--border:#888888;--border-hover:#AAAAAA;
--text:#FFFFFF;--text-secondary:#CCCCCC;--text-muted:#999999;
--today-bg:#002040;--today-border:#56B4E9;
--dz-bg:#2A1A00;--dz-border:#E69F00;--dz-text:#E69F00;
--accent:#56B4E9;--accent-light:#002040;--success:#009E73;--error:#D55E00;
--break-bg:#111111;--break-text:#999999;
--input-bg:#111111;--input-border:#888888;--input-focus:#56B4E9;
--row-open:#002040;--nc-bg:#2A2A2A;--nc-text:#999999;
--mm-tutor-bg:#003020;--mm-tutor-text:#00E088;
--mm-deans-bg:#302000;--mm-deans-text:#E69F00;
--mm-fullsch-bg:#200030;--mm-fullsch-text:#CC79A7;
--mm-chapel-bg:#001830;--mm-chapel-text:#56B4E9;
--flag:#E69F00;--bar-empty:#666666;
--xp-bar:#56B4E9;--xp-bar-bg:#333333;--xp-glow:rgba(86,180,233,.25);
--cal-sel:#56B4E9;--cal-sel-text:#000000;--cal-hover:#002040;--cal-we:#111111;
--on-accent:#000000;
--radius-sm:6px;--radius-md:10px;--radius-lg:14px;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--page);color:var(--text);transition:background .2s,color .2s;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);line-height:1.5}
textarea,input,button,select{font-family:'Inter',system-ui,sans-serif}
.hd{font-family:'Lora',Georgia,serif}
.mn{font-family:'JetBrains Mono',monospace}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg)}
.btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:var(--fs-body);white-space:nowrap;transition:background .15s}
.btn:hover:not(:disabled){background:var(--border)}
.btn:disabled{opacity:.4;cursor:default}
.btn-a{background:var(--accent);color:var(--on-accent);border:none;padding:9px 20px;border-radius:var(--radius-md);cursor:pointer;font-size:var(--fs-body);font-weight:600;transition:opacity .15s}
.btn-a:hover{opacity:.85}
.inp{background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius-sm);color:var(--text);padding:7px 10px;font-size:var(--fs-body);width:100%;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--input-focus)}
.ta{background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius-sm);color:var(--text);padding:7px 10px;font-size:var(--fs-body);width:100%;max-width:100%;outline:none;resize:vertical;overflow:hidden;box-sizing:border-box;transition:border-color .15s}
.ta:focus{border-color:var(--input-focus)}
.fl{font-size:var(--fs-caption);color:var(--text-secondary);display:flex;align-items:center;margin-bottom:5px}
.flb{font-size:var(--fs-caption);color:var(--text-secondary);display:block;margin-bottom:5px}
.brk{padding:4px 14px;font-size:var(--fs-micro);color:var(--break-text);border-bottom:1px solid var(--border);background:var(--break-bg);display:flex;justify-content:space-between;font-style:italic}
.pr{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .12s}
.pr.exp{background:var(--row-open)}
.prd{padding:12px 16px 16px;background:var(--surface-open);border-top:1px solid var(--border)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200}
.pill{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:var(--fs-body);background:var(--surface);color:var(--text-secondary);border:1px solid var(--border);transition:background .15s}
.pill:hover{background:var(--border)}
.vtab{padding:5px 12px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:var(--fs-caption);font-weight:500;background:transparent;color:var(--text-secondary);font-family:'Inter',system-ui,sans-serif;transition:background .15s,color .15s}
.vtab:hover{background:var(--surface)}
.vtab.on{font-weight:600;background:var(--accent);color:var(--on-accent)}
/* Compact phone nav (v2.13.0): the ⋯ overflow menu shown below 800px. */
.navmenu{position:absolute;right:0;top:calc(100% + 4px);z-index:60;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;min-width:180px;display:flex;flex-direction:column;gap:2px}
.navmenu-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;cursor:pointer;color:var(--text);font-family:inherit;font-size:var(--fs-body);padding:9px 10px;border-radius:var(--radius-sm)}
.navmenu-item:hover{background:var(--surface)}
.navmenu-note{font-size:var(--fs-nano);color:var(--text-muted);padding:7px 10px 3px;border-top:1px solid var(--border);margin-top:2px}
.sl{font-size:var(--fs-micro);color:var(--text-muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;font-family:'Inter',system-ui,sans-serif}
.pb{border-radius:var(--radius-sm);padding:4px 7px;margin-bottom:3px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-height:40px;font-size:var(--fs-nano);font-weight:600;overflow:hidden;justify-content:flex-start;min-width:0;transition:outline-color .15s}
.pb:hover{outline:1.5px solid var(--accent)}
.pb-nc{background:var(--nc-bg);color:var(--nc-text);border:1px dashed var(--bar-empty)}
.pb-e{border:1px solid var(--error)}
.pb-top{display:flex;align-items:center;gap:4px;width:100%;justify-content:space-between}
.pb-marks{display:flex;align-items:center;gap:4px;flex-shrink:0}
.pb-mark{display:none;align-items:center;justify-content:center;line-height:1}
.wk-daynote-m{display:none;align-items:center;justify-content:center;width:100%;cursor:pointer;font-size:var(--fs-nano)}
.qe{background:var(--card);border:1.5px solid var(--accent);border-radius:var(--radius-lg);padding:14px 16px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.cv{display:flex;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.cv:hover{background:var(--row-open)}
.cv.empty{opacity:.5}
.xps{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:6px 12px;display:flex;align-items:center;gap:10px;font-size:var(--fs-micro);margin-bottom:8px}
.xpbo{flex:1;height:6px;background:var(--xp-bar-bg);border-radius:3px;overflow:hidden;min-width:50px}
.xpbf{height:100%;background:var(--xp-bar);border-radius:3px;transition:width .6s;box-shadow:0 0 8px var(--xp-glow)}
.bs{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.bm{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:var(--fs-body);border:1px solid var(--border);cursor:pointer;position:relative}
.bm:focus{outline:2px solid var(--accent);outline-offset:1px}
.bm.lk{opacity:.2;filter:grayscale(1)}
.bm .bt{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:6px 10px;font-size:var(--fs-nano);white-space:nowrap;z-index:10;color:var(--text-secondary);box-shadow:0 4px 16px rgba(0,0,0,.12)}
.bm:hover .bt,.bm:focus .bt,.bm.open .bt{display:block}
.srow:hover{background:var(--surface)}
.fwb{font-size:var(--fs-nano);color:var(--text-muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.fw{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-family:'JetBrains Mono',monospace;font-size:var(--fs-nano)}
.wk-grid{display:grid;grid-template-columns:44px repeat(5,1fr);gap:3px 6px;align-items:stretch}
.wk-grid>div{min-width:0;overflow:hidden}
/* On a wide screen the Week grid has room to breathe: bump its chip text one step
   (nano->micro, redefining the variable scoped to the grid so it reaches the inline
   styles too) and widen the column gap slightly. Below 900px nothing changes. */
@media (min-width:900px){.wk-grid{--fs-nano:var(--fs-micro);column-gap:10px}}
/* The 44px label column above fits the widest B-slot word ("before") at both the phone
   (nano) and wide-screen (micro) sizes, so it no longer clips. Phone Week view (v2.13.0):
   each pill shows only the class code plus a status marker, no truncated topic; the
   day-notes field becomes a tappable status indicator that opens Day view. */
@media (max-width:799px){
  .wk-grid .pb{align-items:center;justify-content:center;padding:4px 3px}
  .wk-grid .pb-top{justify-content:center}
  .wk-grid .pb-marks,.wk-grid .pb-sub,.wk-daynote{display:none}
  .wk-grid .pb-mark{display:flex}
  .wk-daynote-m{display:flex}
}
.date-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.date-row .inp{max-width:160px}
.tt-grid{display:grid;gap:4px;font-size:var(--fs-caption)}
.tt-grid select,.tt-grid input{padding:5px 7px;font-size:var(--fs-caption);text-align:center}
.tt-grid .b-cell{cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:30px;border-radius:4px;background:var(--surface);border:1px solid var(--border);user-select:none;padding:2px;font-size:var(--fs-caption);color:var(--border-strong);position:relative}
.tt-grid .b-cell:hover{background:var(--accent-light)}
.tt-grid .b-cell.has-value{color:var(--text)}
.tt-add-row-btn{background:none;border:1px dashed var(--border-strong);border-radius:4px;padding:3px 10px;font-size:var(--fs-micro);color:var(--text-muted);cursor:pointer;font-family:inherit}
.tt-add-row-btn:hover{color:var(--accent);border-color:var(--accent)}
.bs-popup{position:absolute;top:calc(100% + 4px);left:0;background:var(--card);border:1px solid var(--border-strong);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:6px;min-width:180px;z-index:200;text-align:left}
.bs-popup-label{font-size:var(--fs-nano);font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;padding:2px 6px 5px;border-bottom:1px solid var(--border);margin-bottom:4px;white-space:nowrap}
.bs-opt{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:4px;border:none;font-size:var(--fs-caption);font-family:inherit;cursor:pointer;text-align:left;background:transparent;color:var(--text);width:100%}
.bs-opt:hover{background:var(--surface)}
.bs-opt.active{background:var(--surface);font-weight:600}
.bs-opt-clear{color:var(--text-muted);margin-top:3px;border-top:1px solid var(--border);padding-top:6px}
.bs-popup-input{width:100%;padding:5px 7px;border:1px solid var(--border-strong);border-radius:4px;font-family:inherit;font-size:var(--fs-caption);color:var(--text);outline:none;background:var(--card);margin-bottom:4px;display:block;text-align:left}
.bs-popup-input:focus{border-color:var(--accent)}
/* iOS zoom-on-focus fix (v2.11.1): Safari zooms the page when a focused input's
   font is under 16px. On touch (coarse) pointers, floor every text control at 16px.
   !important is deliberate: a few inputs (class editor, weekly activity, search,
   the timetable class combo) set their desktop size via an inline fontSize, and
   inline styles otherwise beat a stylesheet rule. All those inputs carry .inp, so
   listing the shared classes here covers them without per-input logic. Fine-pointer
   (desktop) devices never match this query, so nothing changes there. */
@media (pointer:coarse){.inp,.ta,.bs-popup-input,.tt-grid select,.tt-grid input{font-size:16px!important}}
.bs-popup-confirm{width:100%;padding:5px 7px;background:var(--accent);color:#fff;border:none;border-radius:4px;font-size:var(--fs-caption);font-family:inherit;cursor:pointer;font-weight:600}
.bs-popup-confirm:hover{filter:brightness(.92)}
.bs-chip{font-size:var(--fs-nano);font-weight:600;padding:2px 6px;border-radius:3px;display:inline-flex;align-items:center;gap:3px;line-height:1.3;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bs-chip-activity{background:var(--surface);color:var(--text-secondary);border-radius:10px;border:1.5px solid var(--border-strong)}
.bs-chip-duty{border-radius:10px;border:1.5px solid currentColor}
.bs-row{cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--border);user-select:none}
.bs-row:hover{background:var(--surface)}
.bs-row.gap{color:var(--text-muted)}
.bs-row .bs-row-label{font-weight:600;font-size:var(--fs-body);min-width:96px;flex-shrink:0}
.bs-row.gap .bs-row-label{font-style:italic;font-weight:500}
.bs-row .bs-row-time{margin-left:auto;font-size:var(--fs-micro);color:var(--text-muted)}
.bs-row-editor{padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
.bs-row-editor h4{font-size:var(--fs-caption);font-weight:600;color:var(--text);margin-bottom:6px}
.bs-row-default{font-size:var(--fs-nano);color:var(--text-muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.bs-override-dot{width:6px;height:6px;border-radius:50%;background:var(--error);display:inline-block;flex-shrink:0}
.bs-override-banner{font-size:var(--fs-nano);color:var(--error);font-style:italic;margin:6px 0;padding:4px 8px;background:rgba(213,94,0,.08);border-radius:4px}
.bs-clash{font-size:var(--fs-nano);color:var(--flag);font-weight:700;display:inline-block;line-height:1;cursor:help}
.bs-clash-banner{font-size:var(--fs-nano);color:var(--flag);font-style:italic;margin:6px 0;padding:4px 8px;background:rgba(230,159,0,.1);border-radius:4px}
.bs-edit-options{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.bs-edit-options button{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:var(--fs-caption);cursor:pointer;color:var(--text);font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.bs-edit-options button:hover{background:var(--accent-light);border-color:var(--accent)}
.bs-edit-options button.staged{background:var(--accent-light);border-color:var(--accent);font-weight:600}

<body>
<div id="root"></div>
<script type="text/babel">
/* ════════════════════════════════════════════════════════════════════════════
 * LESSON PLANNER — ARCHITECTURE OVERVIEW
 * ════════════════════════════════════════════════════════════════════════════
 *
 * This is a single-file React app. All state lives in localStorage; an optional
 * GitHub Gist is used as cross-device sync. There is no server.
 *
 * KEY DATA SHAPES (all stored as JSON in localStorage)
 *
 *   planner-config         { school, cycleDays, terms[], holidays[], dayZeros[],
 *                            classes[], timetable, anchor, theme, exportStyle, ...
 *                            userName, showGam }
 *
 *   note:<date>:<periodId>  { subject, notes, resources, status }
 *                          status === "nl" means "No lesson" (assembly etc.)
 *                          date format: YYYY-M-D, UNPADDED, with a JS
 *                          zero-indexed month (0=Jan .. 11=Dec). So 25 May
 *                          2026 is "2026-4-25". Produced by toDateKey(); see its
 *                          comment for the full explanation.
 *                          periodId: "p1".."p6"
 *
 *   daymeta:<date>          { dayNotes, day0label, reflections, overrides }
 *                          overrides is a map of B-slot code -> value (per-date deviations from cycle defaults)
 *
 *   planner-gh-token        GitHub PAT with `gist` scope (string)
 *   planner-gist-id         The Gist holding the cloud-sync copy (string)
 *   planner-last-sync       ISO timestamp anchored to gist's _meta.synced
 *   planner-theme           Display mode (light / dark / light-hc / dark-hc)
 *
 * COMPONENT HIERARCHY (top-down)
 *
 *   App
 *     header (nav tabs, day/night toggle, data button)
 *     storage-failed banner (when localStorage quota is hit)
 *     <DataPanel> (modal overlay, sync + import/export)
 *     one of:
 *       <TermView>      — term-at-a-glance grid, click into a day or week
 *       <WeekView>      — five-day grid with quick-edit panel per period
 *       <DayView>       — single day, periods stacked, full edit per period
 *       <ClassView>     — all lessons for one class across selected term(s)
 *       <LabView>       — gamification dashboard (XP, weekly bar, achievements)
 *       <SettingsView>  — config editor (terms, holidays, classes, timetable, ...)
 *
 * THE KEY ENGINE
 *
 *   makeDateEngine(cfg) returns an object exposing:
 *     isSchoolDay(d)   — is d a school day? (weekday & in term & not a holiday)
 *     cycleDayFor(d)   — what's d's rotation cycle day (1..N), or 0 if it's a Day 0 event
 *     nearestSchoolDay(d, dir) — walk forward/back from d to find the next school day
 *     getTermWeeks(term) — list of [Mon..Fri] weeks within a term
 *     timetable, classMap, classCodes, PIDS, terms, ...
 *
 *   The cycle-day calculation is the cleverest piece of code in the file. It
 *   walks teaching-days from a user-defined anchor, skipping weekends, holidays
 *   and Day 0 events, to compute a number 1..N. See cycleDayFor() for full details.
 *
 * DATA FLOW
 *
 *   Saves go through useAutoSave, which debounces by 80ms, writes via storageSet,
 *   and on success notifies window._plannerSync (debounced gist push) and
 *   window._plannerGamRefresh (recompute XP). Failed writes (quota) trigger
 *   _storageFailListeners; the App component shows a sticky banner.
 *
 *   Pulls (manual or startup auto-pull) run through checkSyncConflict before
 *   importAllData. importAllData allowlists keys against NOTE_KEY_RE /
 *   META_KEY_RE / "_config" and shape-checks each value before writing.
 *
 * SECURITY POSTURE (audit pass 1, v1.4.0)
 *
 *   - SRI hashes on all CDN scripts (React, ReactDOM, Babel)
 *   - CSP meta tag restricting script/style/connect/font sources
 *   - Backup and Gist imports allowlisted by key shape and value shape
 *   - Gist sync conflict detection (older / fewer / version-mismatch)
 *   - Gist ID connection preview before adopting a new Gist
 *   - Bearer token auth with explicit GitHub API version header
 *
 *   See security-walkthrough.org for the full story and the lessons learned.
 *
 * FOR FUTURE READERS
 *
 *   Identifiers use full English names (storageGet, toDateKey, cycleDayFor,
 *   isSchoolDay, metaCache, handleBlur, ...). This file was once kept compact with
 *   short names (sGet, dk, cycD, isSD, mc, hBlr); v2.17.0 renamed them layer by
 *   layer. The one deliberate exception is toDateKey's output FORMAT (YYYY-M-D,
 *   unpadded, zero-indexed month), which is load-bearing and unchanged — see its
 *   comment. Each function still carries a comment explaining what it does.
 * ════════════════════════════════════════════════════════════════════════════
 */
const {useState,useEffect,useRef,useCallback,useMemo,createContext,useContext}=React;
//__TEST_CORE_START__  (tests.html slices the pure core between these two markers and evals it; keep both markers and keep this region JSX-free)

/* ════════════════════════════════════════════════════════════════════════════
 * NAMED CONSTANTS — magic numbers extracted from inline use sites.
 * ════════════════════════════════════════════════════════════════════════════
 */
// Gamification XP rewards.
const XP_PER_LESSON=10;          // every planned period (or "no lesson") earns this
const XP_PER_PERFECT_WEEK=50;    // bonus when every teaching period in a week is planned
const STREAK_THRESHOLD_PCT=0.8;  // a week counts toward streak if >= 80% planned
const ALL_HALF_THRESHOLD_PCT=0.5;// "every class >50%" achievement threshold

// useAutoSave timing.
const BLUR_SAVE_MS=80;           // debounce window after a field loses focus
const STATUS_PILL_MS=2000;       // how long the "saved"/"error" pill stays visible

// Cloud sync timing.
const SYNC_DEBOUNCE_MS=4000;     // wait this long after a write before pushing to gist
const SYNC_STATUS_OK_MS=3000;    // how long the "synced" badge stays visible
const SYNC_STATUS_ERR_MS=5000;   // how long the "error" badge stays visible

// Cycle-day walk safety bound. The walk should never run this far in practice;
// the limit guards against runaway loops if anchor and target are inconsistent.
const CYCLE_WALK_MAX_DAYS=60;

// When the browser tab becomes visible after being hidden, we pull from the
// gist so edits made on another device show up. Skipped if we synced within
// this window — avoids spamming the API on quick tab-focus toggles.
const PULL_ON_FOCUS_MIN_MS=15000;

const CfgCtx=createContext(null);
function useCfg(){return useContext(CfgCtx)}

const DEFAULT_PALETTE=["#E8C8C0","#EDD9B5","#C5D9C0","#B8CCE0","#D0C0E0","#D4B8A0","#A8C8C0","#E0C0D0","#C0C8A8","#E0D0A8","#B0C0D8","#D8B8B8"];
const TEXT_FOR_BG={"#E8C8C0":"#7A3B30","#EDD9B5":"#7A5A20","#C5D9C0":"#2E5426","#B8CCE0":"#2A4A6B","#D0C0E0":"#4A2E6B","#D4B8A0":"#5C3D20","#A8C8C0":"#1A4A42","#E0C0D0":"#6B2A4A","#C0C8A8":"#3A4420","#E0D0A8":"#5A4A18","#B0C0D8":"#2A3A5A","#D8B8B8":"#5A2E2E"};

// B1_TYPES: chip rendering data for the four B1a (morning structure) values.
// Used by week/day views when a B-slot value has type "b1". The colour vars
// (--mm-*) are reused from v1 since they already map onto Okabe-Ito hues.
const B1_TYPES={
  tutor: {label:"Tutor",  short:"T",  icon:"\u{1F4CB}",bgVar:"--mm-tutor-bg",  txVar:"--mm-tutor-text"},
  chapel:{label:"Chapel", short:"C",  icon:"\u271D\uFE0F",bgVar:"--mm-chapel-bg", txVar:"--mm-chapel-text"},
  fsa:   {label:"FSA",    short:"FSA",icon:"\u{1F393}",bgVar:"--mm-fullsch-bg",txVar:"--mm-fullsch-text"},
  da:    {label:"DA",     short:"DA", icon:"\u{1F3EB}",bgVar:"--mm-deans-bg",  txVar:"--mm-deans-text"}
};
const STD_T={p1:{s:"08:30",e:"09:25"},p2:{s:"09:25",e:"10:20"},mt1:{s:"10:20",e:"10:45"},mt2:{s:"10:45",e:"11:10"},p3:{s:"11:10",e:"12:05"},p4:{s:"12:05",e:"12:55"},l:{s:"12:55",e:"13:50"},p5:{s:"13:50",e:"14:40"},p6:{s:"14:40",e:"15:30"}};
const ASM_T={p1:{s:"08:30",e:"09:20"},p2:{s:"09:20",e:"10:10"},mt1:{s:"10:10",e:"10:50"},mt2:{s:"10:50",e:"11:20"},p3:{s:"11:20",e:"12:10"},p4:{s:"12:10",e:"13:00"},l:{s:"13:00",e:"13:50"},p5:{s:"13:50",e:"14:40"},p6:{s:"14:40",e:"15:30"}};
const FWORDS=["todo","prepare","tbc","tbd","check","remind","follow up","incomplete","print","photocopy"];
const FRE=/\b(todo|prepare|tbc|tbd|check|remind|follow.?up|incomplete|print|photocopy)\b/i;
const hasF=t=>FRE.test(t||"");
// bldP: per-period start/end timings for the six teaching periods. Three call sites
// (plain-text export, WeekView spotHits, ClassView lessons) use it as a point-lookup
// `bldP(isAsm).find(p=>p.id===pid)` for one period at a time. The cosmetic break
// entries (mt1/mt2/l) that were here in v1 have been removed; DayView now drives its
// render from buildSlots and the remaining callers never look them up.
function bldP(isAsm){const T=isAsm?ASM_T:STD_T;return[{id:"P1",label:"P1",start:T.p1.s,end:T.p1.e},{id:"P2",label:"P2",start:T.p2.s,end:T.p2.e},{id:"P3",label:"P3",start:T.p3.s,end:T.p3.e},{id:"P4",label:"P4",start:T.p4.s,end:T.p4.e},{id:"P5",label:"P5",start:T.p5.s,end:T.p5.e},{id:"P6",label:"P6",start:T.p6.s,end:T.p6.e}]}
// isAsmDay: true if this cycle day has an FSA (Full School Assembly) value in either
// of its B1 slots. Derived directly from the timetable so the user does not need to
// tick a separate flag — assembly = whichever cycle day they put FSA in.
function isAsmDay(cycleDay,cfg){
  const day=cfg&&cfg.timetable&&cfg.timetable[cycleDay];if(!day)return false;
  const isFsa=v=>v&&v.t==="b1"&&v.c==="fsa";
  return isFsa(day.B1a)||isFsa(day.B1b);
}
// B-slot timing tables. Step 4 will route these through cfg.timetable[D].assemblyDay
// instead of mmType (which has been removed in step 5).
const BSLOT_T_STD={B0:{s:"08:00",e:"08:30"},B1a:{s:"10:20",e:"10:45"},B1b:{s:"10:45",e:"11:10"},B2a:{s:"12:55",e:"13:20"},B2b:{s:"13:20",e:"13:50"},B3:{s:"15:30",e:""}};
const BSLOT_T_ASM={B0:{s:"08:00",e:"08:30"},B1a:{s:"10:10",e:"10:50"},B1b:{s:"10:50",e:"11:20"},B2a:{s:"13:00",e:"13:25"},B2b:{s:"13:25",e:"13:50"},B3:{s:"15:30",e:""}};
const BSLOT_LABELS={B0:"before school",B1a:"after 2",B1b:"before 3",B2a:"after 4",B2b:"before 5",B3:"after school"};
// valEq: equality for B-slot values. Two nulls are equal; otherwise compare type and payload.
function valEq(a,b){if(!a&&!b)return true;if(!a||!b)return false;if(a.t!==b.t)return false;return a.t==="activity"?a.tx===b.tx:a.c===b.c}
/* buildSlots: ordered renderable slot list for one date.
 *
 * Returns an array of:
 *   { type:"period", id:"P1", label:"P1", start, end }
 *   { type:"bslot",  id:"B1a", code:"B1a", label:"after 2", start, end, value, isOverride }
 *   { type:"gap",    id:"gap-B2a", code:"B2a", label:"after 4", start, end }
 *
 * Resolution order for B-slot values: per-date override > weekly activity > cycle default > null.
 * A B-slot becomes "bslot" when its resolved value is non-null. Otherwise it becomes
 * "gap", except B0 and B3 which are omitted entirely when empty (no edge gap-band).
 *
 * Clash flag: set true when a weekly activity displaces a non-null cycle default. The UI
 * shows a small warning glyph so teachers know the calendar-bound activity is hiding
 * their cycle-bound commitment for this date.
 */
// resolveSlot: shared single source of truth for B-slot resolution. Used by both
// buildSlots (DayView) and the WeekView cell logic so the precedence is identical
// everywhere. Returns { value, isOverride, clash } where:
//   value      - the chip value to render, or null if free.
//   isOverride - per-date override exists and differs from the cycle default.
//   clash      - a weekly activity is displacing a non-null cycle default.
function resolveSlot(slotCode,cycleDay,date,cfg,daymeta){
  const overrides=(daymeta&&daymeta.overrides)||{};
  const day=(cfg&&cfg.timetable&&cfg.timetable[cycleDay])||{};
  const cyc=day[slotCode]||null;
  if(slotCode in overrides){
    const v=overrides[slotCode];
    return{value:v,isOverride:!valEq(v,cyc),clash:false};
  }
  if(date&&cfg&&Array.isArray(cfg.weeklyEvents)){
    const wd=date.getDay();
    const ev=cfg.weeklyEvents.find(e=>e.weekday===wd&&e.slot===slotCode&&e.text&&e.text.trim());
    if(ev)return{value:{t:"activity",tx:ev.text.trim()},isOverride:false,clash:cyc!==null};
  }
  return{value:cyc,isOverride:false,clash:false};
}
// asmBellsForDate: whether the shifted ("assembly") bell schedule applies on a
// date. A per-date override (daymeta.bells = "asm" | "std") wins. Otherwise it
// auto-derives from the RESOLVED morning structure: a Full School Assembly on the
// day (including per-date moves via overrides), not just the cycle default. So
// the bells follow the FSA when it's moved, while the shift can still be set or
// cleared independently (e.g. an extended morning tea with no FSA, or an FSA that
// keeps normal times). daymeta is read from storage if not supplied.
function asmBellsForDate(cycleDay,date,cfg,daymeta){
  const dm=daymeta||(date?storageGet(`daymeta:${toDateKey(date)}`):null);
  if(dm){if(dm.bells==="asm")return true;if(dm.bells==="std")return false;}
  const isFsa=v=>!!(v&&v.t==="b1"&&v.c==="fsa");
  return isFsa(resolveSlot("B1a",cycleDay,date,cfg,dm).value)||isFsa(resolveSlot("B1b",cycleDay,date,cfg,dm).value);
}
// forceShow: optional Set of B-slot codes (e.g. "B0", "B3") to render as a gap row
// even when their resolved value is null. Used by DayView to let teachers add an
// ad-hoc edge event on a single date without making B0/B3 always-visible globally.
// hasSlotNote: optional callback (code -> bool) so B0/B3 also surface when notes
// have been typed for that slot+date even though no value was committed. Lets
// teachers persist a slot just by writing notes, without clicking Activity first.
function buildSlots(cycleDay,daymeta,cfg,date,forceShow,hasSlotNote){
  const useAsm=asmBellsForDate(cycleDay,date,cfg,daymeta);
  const T=useAsm?ASM_T:STD_T;
  const Tb=useAsm?BSLOT_T_ASM:BSLOT_T_STD;
  const isForced=code=>forceShow&&forceShow.has&&forceShow.has(code);
  const noted=code=>!!(hasSlotNote&&hasSlotNote(code));
  const period=pid=>({type:"period",id:pid,label:pid,start:T[pid.toLowerCase()].s,end:T[pid.toLowerCase()].e});
  const bslot=code=>{
    const r=resolveSlot(code,cycleDay,date,cfg,daymeta);const t=Tb[code];
    if(r.value===null){
      if((code==="B0"||code==="B3")&&!isForced(code)&&!noted(code))return null;
      return{type:"gap",id:"gap-"+code,code,label:BSLOT_LABELS[code],start:t.s,end:t.e,isOverride:r.isOverride,clash:r.clash,forced:isForced(code)};
    }
    return{type:"bslot",id:code,code,label:BSLOT_LABELS[code],start:t.s,end:t.e,value:r.value,isOverride:r.isOverride,clash:r.clash};
  };
  const out=[];
  let s;
  if((s=bslot("B0")))out.push(s);
  out.push(period("P1"),period("P2"));
  if((s=bslot("B1a")))out.push(s);
  if((s=bslot("B1b")))out.push(s);
  out.push(period("P3"),period("P4"));
  if((s=bslot("B2a")))out.push(s);
  if((s=bslot("B2b")))out.push(s);
  out.push(period("P5"),period("P6"));
  if((s=bslot("B3")))out.push(s);
  return out;
}

/* ═══ THEME ENGINE ═══════════════════════════════════════════════════════ */
const LEVEL_XP=[0,100,300,600,1000,1800,3000];
const ACH_TRIGGERS=[
  {id:"A1",xp:20,scope:"cum",ck:s=>s.cum.tp>=1},
  {id:"A2",xp:30,scope:"cum",ck:s=>s.cum.tp>=10},
  {id:"A3",xp:40,scope:"term",ck:s=>s.term.allCls},
  {id:"A4",xp:50,scope:"term",ck:s=>s.term.pw>=1},
  {id:"A5",xp:60,scope:"cum",ck:s=>s.cum.sk>=3},
  {id:"A6",xp:80,scope:"cum",ck:s=>s.cum.sk>=5},
  {id:"A7",xp:60,scope:"term",ck:s=>s.term.tl>0&&s.term.tp>=s.term.tl*.5},
  {id:"A8",xp:80,scope:"term",ck:s=>s.term.tl>0&&s.term.tp>=s.term.tl*.75},
  {id:"A9",xp:100,scope:"term",ck:s=>s.term.allHalf},
  {id:"A10",xp:200,scope:"term",ck:s=>s.term.tl>0&&s.term.tp>=s.term.tl},
];

const THEMES={
  physics:{name:"Physics",icon:"\u{1F52C}",labTitle:"Planning Lab",labSub:"Where lesson planning meets physics",weekLabel:"Weekly thrust",

/* ═══ STORAGE + GIST SYNC ════════════════════════════════════════════════
 * Thin wrappers around localStorage that return null on parse failure
 * (storageGet) and notify a listener registry on quota failure (storageSet). The
 * listener registry is how the App component shows a sticky banner when
 * the browser refuses to store any more data.
 * ═══════════════════════════════════════════════════════════════════════
 */
// storageGet: read and JSON-parse one key. Returns null if missing or unparseable.
function storageGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}}
// Registry of callbacks fired when storageSet hits a quota or other write error. The App
// component subscribes so it can show a sticky banner and suspend gist push.
const _storageFailListeners=new Set();
function _onStorageFail(fn){_storageFailListeners.add(fn);return()=>_storageFailListeners.delete(fn)}
function storageSet(k,v){
  try{localStorage.setItem(k,JSON.stringify(v));return true}
  catch(err){_storageFailListeners.forEach(fn=>{try{fn(err,k)}catch{}});return false}
}
// writeRecord: persist a note:/daymeta: record from a USER edit, stamping
// updatedAt=now so the sync merge can pick the most recent version per record.
// Transport paths (import, migrate, sync-apply) must use storageSet, not this, so they
// preserve the incoming timestamp. See SYNC_MERGE_DESIGN.md.
function writeRecord(k,v){
  if((k.slice(0,5)==="note:"||k.slice(0,8)==="daymeta:")&&v&&typeof v==="object"&&!Array.isArray(v))
    return storageSet(k,{...v,updatedAt:new Date().toISOString()});
  return storageSet(k,v);
}
// writeConfig: persist the config from a USER edit, stamping updatedAt so the
// merge can converge settings across devices (newer real timestamp wins).
function writeConfig(cfg){return storageSet("planner-config",{...cfg,updatedAt:new Date().toISOString()})}
// Schema version for backup/sync data. Bump when the on-disk shape changes incompatibly.
// importAllData refuses payloads whose _meta.version is higher than this constant, so an old
// client never silently ingests data from a newer planner version.
const SCHEMA_VERSION=2;
// APP_VERSION is the human-facing release string shown in the header footer. It tracks the
// CHANGELOG's latest entry and is independent of SCHEMA_VERSION (which only changes when the
// stored data shape changes). Bump this on every release.
const APP_VERSION="2.17.0";
// getAllData: collect everything that should be exported or pushed to the gist.
// Includes notes, daymeta, the config, and a fresh _meta timestamp + version stamp.
// The timestamp is consumed by checkSyncConflict on the receiving end.
function getAllData(){const d={};Object.keys(localStorage).forEach(k=>{if(k.startsWith("note:")||k.startsWith("daymeta:"))d[k]=storageGet(k)});d._meta={synced:new Date().toISOString(),version:SCHEMA_VERSION};const cfg=storageGet("planner-config");if(cfg)d._config=cfg;return d}

// Key-allowlist: only "_config", "note:<date>:<periodId>", and "daymeta:<date>" are accepted.
// Note: the date portion is the result of toDateKey(), which uses an unpadded, JS
// zero-indexed month (so 23 March 2026 is "2026-2-23", not "2026-3-23"),
// so the regex deliberately accepts 1-2 digit months and days. Years are still strictly 4 digits.
// Anything else (including unknown localStorage keys an attacker might smuggle in) is recorded in `skipped`.
// Each value is shape-checked (must be a non-array object) before being written.
const NOTE_KEY_RE=/^note:\d{4}-\d{1,2}-\d{1,2}:[a-z0-9]+$/i;
const META_KEY_RE=/^daymeta:\d{4}-\d{1,2}-\d{1,2}$/i;
function importAllData(data){
  if(!data||typeof data!=="object"||Array.isArray(data))return{imported:0,skipped:[],error:"Not a backup object"};
  const v=data._meta&&data._meta.version;
  if(typeof v==="number"&&v>SCHEMA_VERSION)return{imported:0,skipped:[],error:`This backup is from a newer version of the planner (v${v}). Please update before importing.`};
  const skipped=[];let imported=0;
  Object.keys(data).forEach(k=>{
    if(k==="_meta")return;
    if(k==="_config"){
      const c=data[k];
      if(c&&typeof c==="object"&&!Array.isArray(c)){migrateConfig({...c});imported++}
      else skipped.push(k+" (invalid shape)");
      return;
    }
    if(NOTE_KEY_RE.test(k)||META_KEY_RE.test(k)){
      const v=data[k];
      if(v&&typeof v==="object"&&!Array.isArray(v)){storageSet(k,v);imported++}
      else skipped.push(k+" (invalid value)");
      return;
    }
    skipped.push(k+" (unrecognised key)");
  });
  // Imported notes/daymeta may use the v1 shape; canonicalise them now so the rest of
  // the app sees a single shape regardless of where the data came from.
  if(imported>0)migrateStorage();
  return{imported,skipped};
}

// NOTE: the old checkSyncConflict (older/fewer/version heuristics that guarded a
// clobbering pull) was retired when sync became a per-record merge: pulling can no
// longer lose local work, so the only remaining guard is the schema-version check,
// inlined in syncNow. See SYNC_MERGE_DESIGN.md section 9.

/* ═══ SYNC MERGE HELPERS (per-record convergence) ════════════════════════
 * Pure functions implementing the merge described in SYNC_MERGE_DESIGN.md.
 * Not yet wired into the sync path; added and verified in isolation first.
 * The unit of merge is one record (note:/daymeta:/ _config), newer updatedAt
 * wins, so two devices editing different records both survive.
 * ═══════════════════════════════════════════════════════════════════════ */
// 60-day horizon for trimming empty records. A little under a term, well past
// the point where a cleared record has propagated to every device.
const GC_HORIZON_MS=60*864e5;
// recordTimestamp: a record's updatedAt as a number. Missing/invalid = 0 (epoch), so any
// stamped record beats an unstamped legacy one.
function recordTimestamp(r){const t=r&&r.updatedAt?Date.parse(r.updatedAt):NaN;return isNaN(t)?0:t}
// isEmptyRecord: true if a note/daymeta record carries no user content. An empty
// record is a valid tombstone (a cleared note), so it is only GC'd once also old.
function isEmptyRecord(key,r){
  if(!r||typeof r!=="object")return true;
  if(key.slice(0,5)==="note:")return !(r.subject||r.notes||r.resources)&&r.status!=="nl";
  if(key.slice(0,8)==="daymeta:")return !(r.dayNotes||r.reflections||r.day0label)&&!(r.overrides&&Object.keys(r.overrides).length);
  return false;
}
// pickNewer: LWW by updatedAt, with a deterministic JSON tiebreak on exact ties
// so every device converges to the same record without coordination.
function pickNewer(a,b){const ta=recordTimestamp(a),tb=recordTimestamp(b);if(ta>tb)return a;if(tb>ta)return b;return JSON.stringify(a)>=JSON.stringify(b)?a:b}
// mergeData: converge two full blobs (local L, remote R) per record. _config is
// merged whole by its own updatedAt. _meta is left to the caller to regenerate.
function mergeData(L,R){
  const out={},keys=new Set(),isRec=k=>NOTE_KEY_RE.test(k)||META_KEY_RE.test(k);
  Object.keys(L||{}).forEach(k=>{if(isRec(k))keys.add(k)});
  Object.keys(R||{}).forEach(k=>{if(isRec(k))keys.add(k)});
  keys.forEach(k=>{const a=L&&L[k],b=R&&R[k];out[k]=a&&!b?a:b&&!a?b:pickNewer(a,b)});
  const ca=L&&L._config,cb=R&&R._config;
  if(ca||cb)out._config=ca&&!cb?ca:cb&&!ca?cb:pickNewer(ca,cb);
  return out;
}
// gcEmpties: drop records that are BOTH empty AND older than the horizon, so
// recent clears survive as tombstones while ancient empties are trimmed. Runs on
// the merged result. Returns {data, dropped}.
function gcEmpties(data,nowMs){
  const out={};let dropped=0;
  Object.keys(data).forEach(k=>{
    if((NOTE_KEY_RE.test(k)||META_KEY_RE.test(k))&&isEmptyRecord(k,data[k])&&(nowMs-recordTimestamp(data[k]))>GC_HORIZON_MS){dropped++;return}
    out[k]=data[k];
  });
  return{data:out,dropped};
}

// GitHub API headers. Bearer auth with explicit Accept and version header per
// the modern GitHub recommendation. The token is a personal access token with
// `gist` scope; it lives only in this user's localStorage and is sent over HTTPS.
const GH_HEADERS=tok=>({"Authorization":"Bearer "+tok,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
// gistCreate: POST a fresh secret gist containing planner-data.json. Resolves to the new gist's id.
function gistCreate(tok,data){return fetch("https://api.github.com/gists",{method:"POST",headers:{...GH_HEADERS(tok),"Content-Type":"application/json"},body:JSON.stringify({description:"Lesson Planner Data","public":false,files:{"planner-data.json":{content:JSON.stringify(data,null,2)}}})}).then(r=>{if(!r.ok)throw new Error;return r.json()}).then(j=>j.id)}
// gistPush: PATCH the existing gist with fresh data. Resolves to true on success.
function gistPush(tok,gid,data){return fetch("https://api.github.com/gists/"+gid,{method:"PATCH",headers:{...GH_HEADERS(tok),"Content-Type":"application/json"},body:JSON.stringify({files:{"planner-data.json":{content:JSON.stringify(data,null,2)}}})}).then(r=>{if(!r.ok)throw new Error;return true})}
// gistPull: GET the gist and return the parsed planner-data.json, or throw.
// Used by the DataPanel connect-preview. The merge sync path uses gistPullSafe.
function gistPull(tok,gid){return fetch("https://api.github.com/gists/"+gid,{headers:GH_HEADERS(tok)}).then(r=>{if(!r.ok)throw new Error;return r.json()}).then(j=>{const f=j.files&&j.files["planner-data.json"];if(!f||!f.content)throw new Error;return JSON.parse(f.content)})}
// gistPullSafe: read for the merge sync. Distinguishes three outcomes so we never
// mistake a failed read for an empty remote (which would clobber on push):
//   {ok:true, data:<blob>}  gist has a data file
//   {ok:true, data:{}}      gist exists but has no data file yet (safe to seed)
//   {ok:false}              network/auth/HTTP/parse failure (abort: do NOT push)
function gistPullSafe(tok,gid){
  return fetch("https://api.github.com/gists/"+gid,{headers:GH_HEADERS(tok)}).then(r=>{
    if(!r.ok)return{ok:false};
    return r.json().then(j=>{
      const f=j.files&&j.files["planner-data.json"];
      if(!f||!f.content)return{ok:true,data:{}};
      try{return{ok:true,data:JSON.parse(f.content)}}catch{return{ok:false}}
    }).catch(()=>({ok:false}));
  }).catch(()=>({ok:false}));
}

/* ═══ CONFIG MIGRATION ═══════════════════════════════════════════════════
 * migrateConfig is run on every config load (from localStorage on startup
 * and after a backup import). Each clause handles one legacy shape and
 * upgrades it in place. New clauses get added at the bottom as the schema
 * evolves; old ones must keep working forever, since old backups can be
 * imported at any time.
 * ═══════════════════════════════════════════════════════════════════════
 */
function migrateConfig(cfg){
  if(!cfg)return cfg;
  // v1.0: holidays[] used to be plain ISO date strings. Now they are {date,name} objects.
  if(cfg.holidays&&cfg.holidays.length>0&&typeof cfg.holidays[0]==="string")cfg.holidays=cfg.holidays.map(d=>({date:d,name:"Public Holiday"}));
  // v1.0: dayZeros[] used to be plain ISO strings. Now {date,label,source} objects.
  if(cfg.dayZeros&&cfg.dayZeros.length>0&&typeof cfg.dayZeros[0]==="string")cfg.dayZeros=cfg.dayZeros.map(d=>({date:d,label:"Day 0",source:"manual"}));
  // Ensure every dayZero has a `source` field (manual vs statutory) — added later, default "manual".
  if(cfg.dayZeros)cfg.dayZeros=cfg.dayZeros.map(d=>({...d,source:d.source||"manual"}));
  // Ensure every class has a description (added later for the timetable picker tooltip).
  if(cfg.classes)cfg.classes=cfg.classes.map(c=>({...c,description:c.description||""}));
  // Default theme for users who pre-date theme support.
  if(!cfg.theme)cfg.theme="physics";
  // School name is fixed in this single-school deployment. Overwrite any prior value
  // so existing users see the canonical name and the input no longer needs to exist.
  cfg.school="Dio";
  // Weekly activities array exists once the user opens 2.1.6+. Defaults to [] so users
  // who do not use this feature see no rendered chip, no clash chip, no extra UI.
  if(!Array.isArray(cfg.weeklyEvents))cfg.weeklyEvents=[];
  // v2: period keys upper-cased (p1→P1) and B-slot keys (B0, B1a, B1b, B2a, B2b, B3) seeded per cycle day.
  // Idempotent: data already in v2 shape passes through unchanged.
  if(cfg.timetable&&typeof cfg.timetable==="object"){
    Object.keys(cfg.timetable).forEach(d=>{
      const day=cfg.timetable[d];
      if(!day||typeof day!=="object")return;
      for(let i=1;i<=6;i++){
        const lo="p"+i,up="P"+i;
        if(lo in day&&!(up in day)){day[up]=day[lo]}
        if(lo in day)delete day[lo];
      }
      ["B0","B1a","B1b","B2a","B2b","B3"].forEach(b=>{if(!(b in day))day[b]=null});
      // Coerce empty/missing P-cells to "nc" so the planned/total counts are honest:
      // an unfilled cell renders with a "nc" placeholder in the timetable input, which
      // teachers read as "set to nc" even when the underlying value was still empty.
      for(let i=1;i<=6;i++){const k="P"+i;if(!day[k])day[k]="nc"}
    });
  }
  // mmType was per-day state in daymeta; defensively strip if it ever leaked into top-level config.
  if("mmType" in cfg)delete cfg.mmType;
  storageSet("planner-config",cfg);return cfg;
}
/* ═══ STORAGE MIGRATION ══════════════════════════════════════════════════
 * migrateStorage runs once at startup (after migrateConfig) and again after
 * a backup import. It re-keys v1 note entries (lower-case period IDs) to v2
 * upper-case, seeds an empty overrides map on every daymeta entry, and
 * strips the obsolete mmType field from every daymeta. Idempotent: a second
 * run is a no-op.
 * ═══════════════════════════════════════════════════════════════════════
 */
function migrateStorage(){
  const noteRe=/^note:(\d{4}-\d{1,2}-\d{1,2}):(p[1-6])$/;
  const renames=[];
  Object.keys(localStorage).forEach(k=>{
    const m=k.match(noteRe);
    if(m)renames.push({old:k,next:`note:${m[1]}:${m[2].toUpperCase()}`});
  });
  renames.forEach(({old,next})=>{
    const v=localStorage.getItem(old);
    if(v!==null&&localStorage.getItem(next)===null)localStorage.setItem(next,v);
    localStorage.removeItem(old);
  });
  Object.keys(localStorage).forEach(k=>{
    if(!k.startsWith("daymeta:"))return;
    const v=storageGet(k);
    if(!v||typeof v!=="object"||Array.isArray(v))return;
    const needsOverrides=!("overrides" in v)||typeof v.overrides!=="object"||v.overrides===null;
    const hasMmType="mmType" in v;
    if(needsOverrides||hasMmType){
      const{mmType,...rest}=v;
      if(needsOverrides)rest.overrides={};
      storageSet(k,rest);
    }
  });
}
// syncHolsToDZ: keep the dayZeros list in sync with the holidays list.
// Statutory holidays automatically appear as dayZeros (the cycle pauses on them).
// Manual dayZeros (e.g. EOTC days) are preserved untouched.
function syncHolsToDZ(holidays,dayZeros){
  const holDates=new Set((holidays||[]).map(h=>h.date));
  // Drop statutory dayZeros whose holiday no longer exists; keep all manual ones.
  let dz=(dayZeros||[]).filter(d=>d.source!=="statutory"||holDates.has(d.date));
  const dzDates=new Set(dz.map(d=>d.date));
  // Add a statutory dayZero for any holiday that isn't already represented.
  (holidays||[]).forEach(h=>{if(!dzDates.has(h.date))dz.push({date:h.date,label:h.name||"Public Holiday",source:"statutory"})});
  // Refresh statutory dayZero labels from their corresponding holiday name.
  dz=dz.map(d=>{if(d.source==="statutory"){const h=(holidays||[]).find(hh=>hh.date===d.date);if(h)return{...d,label:h.name||"Public Holiday"}}return d});
  return dz;
}

/* ═══ DATE ENGINE ════════════════════════════════════════════════════════
 * Date helpers and the cycle-day calculator. The cycle-day calculator is
 * the most domain-specific piece of code in the file — it implements the
 * "rotating timetable" used by the school, where the cycle advances one
 * day per teaching day (skipping weekends, holidays, and Day 0 events).
 * ═══════════════════════════════════════════════════════════════════════
 */
// toDateKey: short date key for a Date. Format is YYYY-M-D where M is the JS
// zero-indexed month (0=Jan .. 11=Dec) and both M and D are UNPADDED.
// IMPORTANT off-by-one vs human months: the M field is getMonth(), NOT
// getMonth()+1. So 23 March 2026 is "2026-2-23" and 25 May 2026 is
// "2026-4-25". An external script reading a backup must subtract 1 from
// the human month to match these keys. Used as a localStorage key suffix
// throughout: note:<dk>:<pid> and daymeta:<dk>. Do not pad, do not +1.
const toDateKey=d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
// dck: same as toDateKey but with month+1, used internally for set-membership checks
// against ISO-like strings produced from cfg.holidays / cfg.dayZeros.
const dck=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
// Display formatters. fmtF = "Monday, 23 March 2026". fmtS = "Mon, 23 Mar".
const fmtF=d=>d.toLocaleDateString("en-NZ",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const fmtS=d=>d.toLocaleDateString("en-NZ",{weekday:"short",day:"numeric",month:"short"});
// fmtISO/parseISO: round-trip ISO 8601 date (YYYY-MM-DD, padded). Used for cfg storage.
const fmtISO=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return`${y}-${m}-${dd}`};
const parseISO=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
// isWE: true if Saturday or Sunday.
const isWE=d=>{const w=d.getDay();return w===0||w===6};
// addD: add n days to a date, returning a new Date. Wall-clock based (DST-safe).
const addD=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
// getMon: return the Monday of the week containing d (handles Sunday correctly).
function getMon(d){const r=new Date(d),w=r.getDay();r.setDate(r.getDate()-(w===0?6:w-1));r.setHours(0,0,0,0);return r}
// getPlanMon: like getMon but if d is a weekend, returns the Monday of the *next* week.
// Used for "where should the planner default to" on weekend opens.
function getPlanMon(d){const w=d.getDay();if(w===0||w===6){const r=new Date(d);r.setDate(r.getDate()+(w===0?1:2));r.setHours(0,0,0,0);return r}return getMon(d)}
// getWDs: return [Mon, Tue, Wed, Thu, Fri] for the week containing b.
const getWDs=b=>{const m=getMon(b);return[0,1,2,3,4].map(i=>addD(m,i))};

// makeDateEngine: build the canonical "what day is what" object from a config.
// Holds the timetable, term boundaries, holiday/dayZero sets, and exposes the
// cycle-day calculator (cycleDayFor), school-day predicate (isSchoolDay), and various walks.
// Consumed by every view via a React context (CfgCtx / useCfg).
function makeDateEngine(cfg){
  if(!cfg)return null;
  const holDates=(cfg.holidays||[]).map(h=>typeof h==="string"?h:h.date);
  const dzDates=(cfg.dayZeros||[]).map(d=>typeof d==="string"?d:d.date);
  const holSet=new Set(holDates.map(s=>dck(parseISO(s))));
  const dzSet=new Set(dzDates.map(s=>dck(parseISO(s))));
  const terms=(cfg.terms||[]).filter(t=>t.start&&t.end).map(t=>({n:t.n,start:parseISO(t.start),end:parseISO(t.end)}));
  const anchor=(cfg.anchor&&cfg.anchor.date)?{date:parseISO(cfg.anchor.date),day:cfg.anchor.day}:null;
  const timetable=cfg.timetable||{};
  const timetableS2=cfg.timetableS2||null;
  const semesterBoundary=cfg.semesterBoundary?parseISO(cfg.semesterBoundary):null;
  const classes=(cfg.classes||[]);
  const classMap={};classes.forEach(c=>{classMap[c.code]={bg:c.colour,tx:TEXT_FOR_BG[c.colour]||"#000",desc:c.description||"",semester:c.semester||"full"}});
  const classCodes=classes.map(c=>c.code);
  // Pick the timetable grid that applies on `date`. If no semester boundary is set or
  // no S2 grid exists, the regular timetable is used for every date.
  function timetableForDate(date){
    if(!semesterBoundary||!timetableS2||!date)return timetable;
    const d=new Date(date);d.setHours(0,0,0,0);
    return d>=semesterBoundary?timetableS2:timetable;
  }
  // True if class `code` is active on `date` per its semester field.
  // A class with no semester field, or "full", is always active. Missing boundary date
  // also degrades to always-active so non-users see no behavioural change.
  function classActiveOn(code,date){
    if(!code||code==="nc")return false;
    const cls=classes.find(c=>c.code===code);
    if(!cls||!cls.semester||cls.semester==="full")return true;
    if(!semesterBoundary||!date)return true;
    const d=new Date(date);d.setHours(0,0,0,0);
    if(cls.semester==="S1")return d<semesterBoundary;
    if(cls.semester==="S2")return d>=semesterBoundary;
    return true;
  }
  // Single source of truth for "what class meets this cell on this date".
  // Returns the class code if active and present; otherwise "nc".
  function classAt(date,cd,pid){
    const tt=timetableForDate(date);
    const code=(tt[cd]||{})[pid];
    if(!code||code==="nc")return"nc";
    if(!classActiveOn(code,date))return"nc";
    return code;
  }
  const nCycle=cfg.cycleDays||7;
  const PIDS=[];for(let i=1;i<=6;i++)PIDS.push("P"+i);
  const isPH=d=>holSet.has(dck(d));const isDZ=d=>dzSet.has(dck(d));
  const inT=d=>terms.some(t=>d>=t.start&&d<=t.end);
  const isSchoolDay=d=>!isWE(d)&&!isPH(d)&&inT(d);const isTeachingDay=d=>isSchoolDay(d)&&!isDZ(d);
  const wkN=b=>8+Math.round((getMon(b)-(anchor?getMon(anchor.date):getMon(new Date())))/(7*864e5));

  function termWkN(weekdays){
    for(const term of terms){
      const ts=new Date(term.start);ts.setHours(0,0,0,0);const te=new Date(term.end);te.setHours(23,59,59,999);
      if(weekdays.some(d=>{const dd=new Date(d);dd.setHours(0,0,0,0);return dd>=ts&&dd<=te})){
        const curMon=getMon(weekdays[0]);curMon.setHours(12,0,0,0);const termMon=getMon(ts);termMon.setHours(12,0,0,0);
        return{tn:term.n,wk:Math.floor(Math.round((curMon-termMon)/864e5)/7)+1};
      }
    }return null;
  }
  // nearestSchoolDay: walk forward (dir=+1) or back (dir=-1) one day at a time until we hit
  // a school day, or give up after CYCLE_WALK_MAX_DAYS. Used for Prev/Next nav
  // and for snapping to a school day when entering Day View on a holiday.
  function nearestSchoolDay(d,dir){let x=addD(d,dir);for(let i=0;i<CYCLE_WALK_MAX_DAYS;i++){if(isSchoolDay(x))return x;x=addD(x,dir)}return null}
  /*
   * cycleDayFor: compute the rotation cycle day for `date`, in 1..nCycle.
   *
   * Returns:
   *   null  — not a school day (weekend, holiday, outside terms)
   *   0     — Day 0 event (cycle is paused for orientation, EOTC, etc.)
   *   1..N  — the cycle day, where N = cfg.cycleDays (typically 7)
   *
   * Algorithm: walk teaching days from a user-defined anchor.
   *
   * The user pins one date to one cycle day (anchor.date, anchor.day). To find
   * the cycle day for any other date, we count "teaching days" between the
   * two (isTeachingDay: school days that are not Day 0 events) and add or subtract
   * that count from anchor.day, modulo nCycle.
   *
   * Forward walk (target on or after anchor): start at anchor, step +1 day,
   * increment n on teaching days, stop when we reach the target.
   *
   * Backward walk: step -1 day, increment n on teaching days. The double-
   * modulo at the end handles negative results (in JS, (-1 % 7) is -1 but
   * we want 6).
   *
   * Cost is O(distance-from-anchor), which is fine — anchor is usually the
   * current term, and views never render more than a year of dates at once.
   */
  // cdMemo: lazily-built Map<dateKey, cycleDay> covering every teaching day in
  // every term, so cycleDayFor is an O(1) lookup instead of an O(distance-from-anchor)
  // walk per call (the old behaviour made compGam quadratic late in the year).
  // Built in two linear passes out from the anchor. Recreated automatically
  // whenever the engine is rebuilt (i.e. on any cfg change), so no manual
  // invalidation is needed.
  let cdMemo=null;
  function buildCdMemo(){
    cdMemo=new Map();
    if(!anchor||!terms.length)return;
    let lo=null,hi=null;
    terms.forEach(tm=>{const s=new Date(tm.start);s.setHours(0,0,0,0);const e=new Date(tm.end);e.setHours(0,0,0,0);if(!lo||s<lo)lo=s;if(!hi||e>hi)hi=e});
    const a=new Date(anchor.date);a.setHours(0,0,0,0);
    // Forward (anchor → hi): n = isTeachingDay count in [anchor, d); set cycle then advance n.
    let n=0,d=new Date(a);
    while(d<=hi){if(isTeachingDay(d)){cdMemo.set(toDateKey(d),((anchor.day-1+n)%nCycle)+1);n++}d.setDate(d.getDate()+1)}
    // Backward (anchor-1 → lo): m = isTeachingDay count in [d, anchor); advance m then set cycle.
    let m=0;d=new Date(a);d.setDate(d.getDate()-1);
    while(d>=lo){if(isTeachingDay(d)){m++;cdMemo.set(toDateKey(d),(((anchor.day-1-m)%nCycle)+nCycle)%nCycle+1)}d.setDate(d.getDate()-1)}
  }
  // cycDcompute: the original O(distance) walk. Kept as a safety fallback for any
  // teaching day outside the precomputed term span (should not occur in practice).
  function cycDcompute(t){
    const a=new Date(anchor.date);a.setHours(0,0,0,0);
    let n=0,d=new Date(a);
    if(t>=a){while(d<t){if(isTeachingDay(d))n++;d.setDate(d.getDate()+1)}return((anchor.day-1+n)%nCycle)+1}
    while(d>t){d.setDate(d.getDate()-1);if(isTeachingDay(d))n++}return(((anchor.day-1-n)%nCycle)+nCycle)%nCycle+1;
  }
  function cycleDayFor(date){
    const t=new Date(date);t.setHours(0,0,0,0);
    if(!isSchoolDay(t))return null;     // weekend, holiday, or outside terms
    if(isDZ(t))return 0;         // teaching paused: Day 0 event
    if(!anchor)return 1;         // no anchor configured yet
    if(!cdMemo)buildCdMemo();
    const v=cdMemo.get(toDateKey(t));
    return v!==undefined?v:cycDcompute(t);
  }
  function getTermWeeks(term){
    const ts=new Date(term.start);ts.setHours(0,0,0,0);const te=new Date(term.end);te.setHours(23,59,59,999);
    const ws=[];let d=getMon(ts);while(d<=te){const days=[0,1,2,3,4].map(i=>addD(d,i));if(days.some(x=>{const xn=new Date(x);xn.setHours(0,0,0,0);return xn>=ts&&xn<=te}))ws.push(days);d=addD(d,7)}return ws;
  }
  // classLessons routes through classAt, so semester-bounded classes and S2 timetable
  // variants are honoured: a date that no longer carries the class produces no entry.
  function classLessons(cc,ti=0){const term=terms[ti];if(!term)return[];const ls=[];getTermWeeks(term).flat().forEach(d=>{const cd=cycleDayFor(d);if(!cd||cd===0)return;PIDS.forEach(pid=>{if(classAt(d,cd,pid)===cc)ls.push({date:new Date(d),dk:toDateKey(d),pid,cd})})});return ls}
  function lessonContext(cc,dateKey,pid,ti=0){if(!cc||cc==="nc")return null;const ls=classLessons(cc,ti);const idx=ls.findIndex(l=>l.dk===dateKey&&l.pid===pid);if(idx===-1)return null;return{num:idx+1,total:ls.length,prev:ls[idx-1]||null,next:ls[idx+1]||null}}
  return{isPH,isDZ,inT,isSchoolDay,isTeachingDay,wkN,termWkN,nearestSchoolDay,cycleDayFor,getTermWeeks,classLessons,lessonContext,terms,timetable,timetableForDate,classAt,classActiveOn,semesterBoundary,classMap,classCodes,PIDS,nCycle,school:cfg.school||"My School"};
}

/* ═══ DATA DEFAULTS ══════════════════════════════════════════════════════ */
const emptyNote=()=>({subject:"",notes:"",resources:"",status:""});
const emptyMeta=()=>({dayNotes:"",day0label:"",reflections:"",overrides:{}});
const normalizeMeta=v=>({...emptyMeta(),...(v||{})});
//__TEST_CORE_END__  (end of the pure core sliced by tests.html; components/JSX begin below)

/* ═══ UNIVERSAL GAMIFICATION ENGINE ══════════════════════════════════════
 * compGam: read every saved note from localStorage and compute the
 * gamification snapshot the views need.
 *
 * Args:
 *   eng       — date engine (from makeDateEngine), or null
 *   pwn       — the "current" week number (used as the streak's reference week)
 *   themeKey  — which theme's level titles / achievement icons to use
 *
 * Returns a flat object consumed by XpStrip, Badges, TermView, ClassView,
 * and LabView:
 *   cum   — cumulative stats across all terms (tp planned, tl total, sk streak, ls longest)
 *   term  — same, but only for the active term, plus pw (perfect weeks) and per-class cd
 *   achs  — list of achievement objects with `unlocked` bool computed against state
 *   xp    — total XP: tp * XP_PER_LESSON + pw * XP_PER_PERFECT_WEEK + bonuses from unlocked achs
 *   lev   — current level object {icon,title}, looked up via LEVEL_XP thresholds
 *   nxt   — next level (or null at max)
 *   cw    — current-week stats {p,t} for the weekly visual
 *   th    — the theme object itself, passed through
 *
 * The recipe is straightforward — it's the sheer number of derived values
 * that makes it dense. Each piece is computed once, shared via the `st`
 * snapshot for the achievement triggers, and bundled into the return.
 * ═══════════════════════════════════════════════════════════════════════
 */
function compGam(eng,pwn,themeKey){
  const th=getTheme(themeKey);
  const empty={cum:{tp:0,tl:0,sk:0,ls:0},term:{tp:0,tl:0,pw:0,allCls:false,allHalf:false,cd:{}},sk:0,ls:0,achs:[],xp:0,lev:th.levels[0],nxt:th.levels[1],levXp:0,nxtXp:100,cw:{p:0,t:0},th,pw:0,tp:0,tl:0,wd:{},cd:{}};
  if(!eng)return empty;
  const now=new Date();now.setHours(0,0,0,0);
  // Active-term index: pick the first term whose end is in the future, or the last term otherwise.
  let ati=0;for(let i=0;i<eng.terms.length;i++){if(now<=eng.terms[i].end){ati=i;break}else ati=i}

  // calcStats: walk every school day in the given terms, count total teaching periods (tl)
  // and planned periods (tp), and roll up by week (wd) and by class (cd). This is the only
  // place that touches localStorage in compGam; everything else is derived from these counts.
  function calcStats(termList){
    const wd={},cd={};let tp=0,tl=0;
    termList.forEach(term=>{eng.getTermWeeks(term).flat().forEach(d=>{
      const c=eng.cycleDayFor(d);if(!c||c===0)return;const key=toDateKey(d),wn=eng.wkN(d);
      if(!wd[wn])wd[wn]={p:0,t:0};
      eng.PIDS.forEach(pid=>{const cls=eng.classAt(d,c,pid);if(cls==="nc")return;
        tl++;wd[wn].t++;if(!cd[cls])cd[cls]={p:0,t:0};cd[cls].t++;
        const n=storageGet(`note:${key}:${pid}`);if(n&&(n.subject||n.notes||n.status==="nl")){tp++;wd[wn].p++;cd[cls].p++}});
    })});
    const pw=Object.values(wd).filter(w=>w.t>0&&w.p===w.t).length;
    const allCls=eng.classCodes.length>0&&eng.classCodes.every(c=>cd[c]&&cd[c].p>0);
    const allHalf=eng.classCodes.length>0&&eng.classCodes.every(c=>{const d=cd[c];return d&&d.p>d.t*ALL_HALF_THRESHOLD_PCT});
    return{tp,tl,pw,wd,cd,allCls,allHalf};
  }

  // Two passes: cumulative (all terms) and active-term-only.
  const cum=calcStats(eng.terms);
  const at=eng.terms[ati];const term=at?calcStats([at]):{tp:0,tl:0,pw:0,wd:{},cd:{},allCls:false,allHalf:false};

  // Streak (sk): count consecutive weeks ending at pwn where >=80% of teaching periods were planned.
  // Walk weeks in reverse-chronological order; stop as soon as a week falls below threshold.
  const sorted=Object.keys(cum.wd).map(Number).filter(n=>n<=pwn).sort((a,b)=>b-a);
  let sk=0;for(const wn of sorted){const w=cum.wd[wn];if(w&&w.t>0&&w.p/w.t>=STREAK_THRESHOLD_PCT)sk++;else break}
  // Longest streak (ls): walk weeks in chronological order, track the longest run of >=80% weeks.
  // This is independent of `sk`: the longest streak might not be the current one.
  let longest=0,run=0;Object.keys(cum.wd).map(Number).sort((a,b)=>a-b).forEach(wn=>{const w=cum.wd[wn];if(w&&w.t>0&&w.p/w.t>=STREAK_THRESHOLD_PCT){run++;if(run>longest)longest=run}else run=0});

  // Snapshot used by the achievement triggers (each trigger's ck() reads from this).
  const st={cum:{...cum,sk,ls:longest},term};
  // Each achievement combines its trigger (id, xp, ck) with the theme's icon/title/etc.
  const achs=ACH_TRIGGERS.map((a,i)=>({...a,...th.achs[i],unlocked:a.ck(st)}));
  // Total XP: planned periods, perfect-week bonuses, and unlocked achievement bonuses.
  let xp=cum.tp*XP_PER_LESSON+cum.pw*XP_PER_PERFECT_WEEK;achs.forEach(a=>{if(a.unlocked)xp+=a.xp});
  // Look up the highest level whose XP threshold has been crossed.
  let levIdx=0;LEVEL_XP.forEach((x,i)=>{if(xp>=x)levIdx=i});
  const cw=cum.wd[pwn]||{p:0,t:0};
  return{cum,term,sk,ls:longest,achs,xp,lev:th.levels[levIdx],nxt:th.levels[levIdx+1]||null,levXp:LEVEL_XP[levIdx],nxtXp:LEVEL_XP[levIdx+1],cw,th,pw:cum.pw,tp:cum.tp,tl:cum.tl,wd:cum.wd,cd:cum.cd};
}

/* ═══ HOOKS ══════════════════════════════════════════════════════════════
 * useAutoSave: the central save mechanism. Every editable form in the app
 * uses this hook for its persistence.
 *
 * Lifecycle:
 *   1. On mount or sk change: read sk from localStorage, merge with defaults
 *      (dv), expose as `data`.
 *   2. updateField(f, v): mutate the in-memory record and re-render.
 *   3. handleFocus / handleBlur: cancel or schedule a save with BLUR_SAVE_MS debounce.
 *   4. save(): synchronously call storageSet, fire onSave/sync/gam-refresh hooks
 *      on success, surface a status pill via `saveStatus` for STATUS_PILL_MS.
 *   5. On tab close (beforeunload/pagehide/visibilitychange): flush any
 *      pending blur-debounce timer so typed text is never lost.
 *
 * Args:
 *   sk     — localStorage key, or null/empty to disable persistence
 *   dv     — defaults object, merged with the stored value at read time
 *   onSave — optional callback fired with the saved record (used by Day View
 *            to update its in-memory metaCache cache)
 *
 * Returns: { data, updateField, saveStatus, handleFocus, handleBlur, save }
 * ═══════════════════════════════════════════════════════════════════════
 */
function useAutoSave(sk,dv,onSave){

  // dirtyRef tracks whether ref.current holds typed-but-not-yet-saved content. Set by
  // updateField on every keystroke; cleared after a successful save; reset on sk change.
  // The unmount-cleanup uses it to decide whether to flush before the consumer unmounts
  // (which happens on SPA navigation that swaps views or changes dates).
  const dirtyRef=useRef(false);
  // onSaveRef captures the latest onSave callback so cleanup-flushes can notify the
  // parent even if the original callback closure was already stale.

// grabLine: prefer a "Grab:" line if the reflection has one; else a short
// single-line snippet cut on a word boundary (no ellipsis; the expand caret
// signals there is more).
function grabLine(text){
  for(const ln of text.split("\n")){const m=ln.match(/^\s*grab\s*:\s*(.+)$/i);if(m&&m[1].trim())return"Grab: "+m[1].trim()}
  const flat=text.replace(/\s+/g," ").trim();
  if(flat.length<=100)return flat;
  const cut=flat.slice(0,100);const sp=cut.lastIndexOf(" ");return sp>40?cut.slice(0,sp):cut;
}

// pickResurfaced: stateless surfacing of one past reflection. Pure function of
// (viewedDate, localStorage). Buckets reflections by age (week 5-13d, month
// 14-45d, far 45+d) and uses a date-seeded pick, so the choice is stable for the
// day, rotates daily, matches across devices, and needs no stored "seen" state.
// The bucketing is the memory kernel: it guarantees the far past keeps airtime
// no matter how large the corpus grows (uniform random would bury it).
function pickResurfaced(viewedDate){
  const today=new Date(viewedDate);today.setHours(0,0,0,0);
  const buckets={week:[],month:[],far:[]};let n=0;
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);if(!k||k.slice(0,8)!=="daymeta:")continue;
    const m=storageGet(k);if(!m||!m.reflections||!m.reflections.trim())continue;
    const p=k.slice(8).split("-");if(p.length!==3)continue;
    const d=new Date(+p[0],+p[1],+p[2]);d.setHours(0,0,0,0);
    const age=Math.floor((today-d)/864e5);if(age<5)continue;          // too recent to resurface
    const b=age<=13?"week":age<=45?"month":"far";
    buckets[b].push({date:d,text:m.reflections});n++;
  }
  if(!n)return null;
  const order=["week","month","far"].filter(b=>buckets[b].length);
  const s=toDateKey(today);let seed=0;for(let i=0;i<s.length;i++)seed=(seed*31+s.charCodeAt(i))>>>0;
  const bucket=order[seed%order.length];const list=buckets[bucket];
  const pick=list[Math.floor(seed/7)%list.length];
  return{date:pick.date,text:pick.text,bucketLabel:bucket==="week"?"about a week ago":bucket==="month"?"about a month ago":"earlier in the term"};
}

    {open&&data&&<div className="prd" onFocus={handleFocus} onBlur={handleBlur}><div style={{display:"grid",gap:9}}>{ctx&&<div style={{fontSize:"var(--fs-micro)",color:"var(--text-secondary)",background:"var(--surface)",padding:"4px 8px",borderRadius:4,lineHeight:1.5}}>Lesson <span className="mn" style={{fontWeight:700}}>{ctx.num}/{ctx.total}</span> this term{ctx.prev&&<span> {"\u00B7"} prev: {fmtS(ctx.prev.date)}</span>}{ctx.next&&<span> {"\u00B7"} next: {fmtS(ctx.next.date)}</span>}</div>}{!isNc&&<div style={{display:"flex",gap:4}}>{["quick","detailed"].map(m=><button key={m} className="hd" onClick={()=>setMode(m)} style={{padding:"2px 10px",borderRadius:4,border:"none",cursor:"pointer",fontSize:"var(--fs-micro)",fontWeight:mode===m?700:400,background:mode===m?"var(--accent)":"var(--surface)",color:mode===m?"var(--on-accent)":"var(--text-muted)"}}>{m==="quick"?"Quick":"Detailed"}</button>)}</div>}
      {(mode==="quick"||isNc)?<div><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:2}}><label className="fl" style={{marginBottom:0}}>{isNc?"Notes":isNl?"Reason (optional)":"Topic / Quick note"} <SvH saveStatus={saveStatus}/></label>{!isNc&&(nlConfirm?<span style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:"var(--fs-nano)",color:"var(--flag)"}}>Replace topic with No Lesson?<button onMouseDown={e=>{e.preventDefault();markNL()}} style={{background:"var(--accent)",color:"var(--on-accent)",border:"none",borderRadius:3,fontSize:"var(--fs-nano)",padding:"2px 8px",cursor:"pointer",fontWeight:600}}>Yes</button><button onMouseDown={e=>{e.preventDefault();setNlConfirm(false)}} style={{background:"none",border:"none",fontSize:"var(--fs-nano)",cursor:"pointer",color:"var(--text-muted)",padding:"0 4px"}}>Cancel</button></span>:<button onMouseDown={e=>{e.preventDefault();isNl?clearNL():askNL()}} style={{background:"none",border:"none",fontSize:"var(--fs-micro)",cursor:"pointer",color:isNl?"var(--error)":"var(--text-muted)",padding:"0 2px"}}>{isNl?"\u2715 Remove no lesson":"No lesson"}</button>)}</div><AInp data={data} field={isNc?"notes":"subject"} updateField={updateField} handleFocus={handleFocus} handleBlur={handleBlur} ph={isNc?"Meeting, marking, prep":isNl?"e.g. Class has an assembly":"e.g. Newton's 3rd Law"}/></div>:<><div><label className="fl">Topic / Subject <SvH saveStatus={saveStatus}/></label><AInp data={data} field="subject" updateField={updateField} handleFocus={handleFocus} handleBlur={handleBlur} ph="e.g. Newton's 3rd Law"/></div><div><label className="flb">Notes & Tasks</label><AInp data={data} field="notes" updateField={updateField} handleFocus={handleFocus} handleBlur={handleBlur} ph="Lesson plan, tasks" multi rows={3}/></div><div><label className="flb">Resources & Links</label><AInp data={data} field="resources" updateField={updateField} handleFocus={handleFocus} handleBlur={handleBlur} ph="URLs, file n
